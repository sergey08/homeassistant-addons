name: Moonraker MCP DEV
on:
  push:
    branches: [dev/moonraker-mcp-addon]
    paths:
      - 'moonraker_mcp/**'
      - '.github/workflows/moonraker-mcp-dev.yml'
  pull_request:
    branches: [main]
    paths:
      - 'moonraker_mcp/**'
      - '.github/workflows/moonraker-mcp-dev.yml'
  workflow_dispatch:
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n moonraker_mcp/run.sh
      - name: Validate addon YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          with open("moonraker_mcp/config.yaml") as f:
              data=yaml.safe_load(f)
          for key in ("name", "version", "slug", "arch", "options", "schema"):
              assert key in data, f"missing {key}"
          assert data["boot"] == "manual"
          assert data["ports"]["8765/tcp"] is None
          print("Add-on configuration valid")
          PY
      - name: Test fail-closed tool policy
        run: python3 -m unittest discover -s moonraker_mcp -p 'test_*.py' -v

      - name: Record pinned upstream image provenance (informational)
        run: |
          set -eu
          upstream='ghcr.io/lexfrei/mcp-raker@sha256:cdfbb9b4ead2b3f8a253eb55c1996a69cfdbc17088cc111b7d265d8b71f7090e'
          docker pull "$upstream"
          docker image inspect "$upstream" --format 'Pinned image: {{.Id}}'
          docker image inspect "$upstream" --format 'OCI source: {{index .Config.Labels "org.opencontainers.image.source"}}'
          docker image inspect "$upstream" --format 'OCI revision: {{index .Config.Labels "org.opencontainers.image.revision"}}'
          docker image inspect "$upstream" --format 'OCI version: {{index .Config.Labels "org.opencontainers.image.version"}}'
          expected_source='https://github.com/lexfrei/mcp-raker'
          expected_revision='0caea7c31a0780462331e9031e3bf0f435d190ed'
          expected_version='0.2.0'
          actual_source=$(docker image inspect "$upstream" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')
          actual_revision=$(docker image inspect "$upstream" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          actual_version=$(docker image inspect "$upstream" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          test "$actual_source" = "$expected_source"
          test "$actual_revision" = "$expected_revision"
          test "$actual_version" = "$expected_version"
          echo 'Pinned upstream OCI labels match audited revision (not cryptographic attestation).'
          echo 'Provenance labels are informational; matching them to audited source remains a separate verification gate.'
      - name: Build DEV container (no deployment)
        run: docker build --pull --tag moonraker-mcp:dev ./moonraker_mcp
      - name: Verify startup rejects invalid permission settings
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile
          base={"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-test-token"}
          for key, bad in (("enable_objects","true"),("enable_history","true"),("enable_sensors",1),
                           ("enable_spoolman",[]),("enable_power",{"enabled":True})):
              with tempfile.TemporaryDirectory() as tmp:
                  os.chmod(tmp,0o755)
                  with open(os.path.join(tmp,"options.json"),"w") as out:
                      json.dump({**base,key:bad},out)
                  result=subprocess.run(["docker","run","--rm","-v",tmp+":/data:ro",
                                         "moonraker-mcp:dev"],capture_output=True,text=True,timeout=15)
                  assert result.returncode != 0, (key,"invalid value accepted")
                  assert "Optional MCP profiles must be boolean" in result.stderr, (key,result.stderr)
                  print("Rejected invalid permission:",key)
          PY

      - name: Smoke test HTTP MCP auth (no printer commands)
        run: |
          mkdir -p /tmp/moonraker-mcp-options
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-test-token"}' > /tmp/moonraker-mcp-options/options.json
          docker run -d --name moonraker-mcp-ci -p 127.0.0.1:18765:8765 -v /tmp/moonraker-mcp-options:/data:ro moonraker-mcp:dev
          trap 'docker logs moonraker-mcp-ci; docker rm -f moonraker-mcp-ci' EXIT
          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:18765/mcp; then break; fi
            sleep 1
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' http://127.0.0.1:18765/mcp)
          test "$status" = 401 || { echo "Expected 401 without bearer token, got $status"; exit 1; }
          echo "HTTP listener started; unauthenticated access rejected"

      - name: MCP initialize and tools/list protocol smoke test
        run: |
          python - <<'PY'
          import json, urllib.request
          url = "http://127.0.0.1:18765/"
          headers = {
              "Authorization": "Bearer ci-test-token",
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream",
              "MCP-Protocol-Version": "2025-06-18",
          }
          # This step runs in a separate process: launch the server here.
          import subprocess, tempfile, os, time
          with tempfile.TemporaryDirectory() as tmp:
              with open(os.path.join(tmp, "options.json"), "w") as f:
                  json.dump({"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-test-token"}, f)
              os.chmod(tmp, 0o755)  # container runs as uid 65534; TemporaryDirectory defaults to 0700
              subprocess.run(["docker","run","-i","-d","--name","moonraker-mcp-protocol","-p","127.0.0.1:18765:8765","-v",tmp+":/data:ro","moonraker-mcp:dev"], check=True, capture_output=True)
              try:
                  time.sleep(2)
                  state=subprocess.run(["docker","inspect","-f","{{.State.Running}}","moonraker-mcp-protocol"],capture_output=True,text=True)
                  if state.stdout.strip() != "true":
                      logs=subprocess.run(["docker","logs","moonraker-mcp-protocol"],capture_output=True,text=True)
                      raise RuntimeError("MCP container exited: "+logs.stderr+logs.stdout)
                  def request(method, params=None, rid=1, session=None):
                      data={"jsonrpc":"2.0","id":rid,"method":method}
                      if params is not None: data["params"]=params
                      h=dict(headers)
                      if session: h["Mcp-Session-Id"]=session
                      req=urllib.request.Request(url, data=json.dumps(data).encode(), headers=h)
                      with urllib.request.urlopen(req, timeout=10) as response:
                          raw=response.read().decode()
                          if "text/event-stream" in response.headers.get("Content-Type",""):
                              raw="".join(line[6:] for line in raw.splitlines() if line.startswith("data:"))
                          return json.loads(raw), response.headers.get("Mcp-Session-Id")
                  init,session=request("initialize",{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ha-addon-ci","version":"0.1.0"}},1)
                  assert "result" in init and "serverInfo" in init["result"], init
                  result,_=request("tools/list",{},2,session)
                  assert "result" in result and isinstance(result["result"].get("tools"),list), result
                  tools=result["result"]["tools"]
                  assert tools and all(t["name"].startswith("moonraker_") for t in tools)
                  with open("moonraker_mcp/read_only_allowlist.json") as policy_file:
                      allowlist=json.load(policy_file)["allowed_tools"]
                  assert len(allowlist)==len(set(allowlist)), "Duplicate tool names in allowlist"
                  names=sorted(t["name"] for t in tools)
                  assert set(names)==set(allowlist), "Gateway exposed tools outside allowlist"
                  missing=sorted(set(allowlist)-set(names))
                  assert not missing, "Allowlisted tools absent from gateway: "+", ".join(missing)
                  print("Read-only policy candidate:",len(allowlist),"tools; NOT ENFORCED")
                  print("MCP initialize and tools/list OK; tools:",len(tools))
                  print("Registered tools:",", ".join(names))
                  hazardous=("gcode_script","emergency_stop","print_start","print_cancel","printer_restart","firmware_restart")
                  matches=[name for name in names if any(term in name for term in hazardous)]
                  assert not matches, "DANGEROUS: gateway exposed control tools: "+", ".join(matches)
                  print("SECURITY AUDIT: no hazardous controls exposed through gateway")
                  print("Gateway policy verified; printer integration not tested")
                  # Exercise the actual Docker gateway, not only policy unit tests.
                  # Denied calls must fail before any connection to Moonraker.
                  import urllib.error
                  forbidden=[
                      "moonraker_gcode_script",
                      "moonraker_print_start",
                      "moonraker_print_cancel",
                      "moonraker_firmware_restart",
                      "moonraker_files_delete",
                      "moonraker_spoolman_set_spool",
                      "moonraker_new_future_tool",
                  ]
                  for index, name in enumerate(forbidden, start=100):
                      try:
                          request("tools/call",{"name":name,"arguments":{}},index,session)
                      except urllib.error.HTTPError as error:
                          assert error.code==403, (name,error.code)
                      else:
                          raise AssertionError("Forbidden tool reached upstream: "+name)
                  print("Docker HTTP gateway blocked",len(forbidden),"forbidden tool calls")
                  # Verify disabled-by-default privacy groups in the actual container.
                  excluded=("moonraker_history_list","moonraker_history_job",
                            "moonraker_history_totals","moonraker_power_status",
                            "moonraker_sensors_info","moonraker_sensors_list",
                            "moonraker_sensors_measurements","moonraker_spoolman_status",
                            "moonraker_spoolman_get_spool")
                  for index,name in enumerate(excluded,start=200):
                      try:
                          request("tools/call",{"name":name,"arguments":{}},index,session)
                      except urllib.error.HTTPError as error:
                          assert error.code==403,(name,error.code)
                      else:
                          raise AssertionError("Privacy-disabled tool accepted: "+name)
                  print("Docker HTTP gateway rejected all",len(excluded),"privacy-disabled tools")
                  # The raw upstream port must only bind loopback inside Docker.
                  # Inspect the listening socket through /proc without installing netstat.
                  inspection=subprocess.run(
                      ["docker","exec","moonraker-mcp-protocol","python3","-c",
                       "print(open('/proc/net/tcp').read())"],
                      capture_output=True,text=True,check=True)
                  sockets=inspection.stdout.splitlines()
                  upstream_port=format(8766,"04X")
                  upstream_sockets=[line.split() for line in sockets
                                    if len(line.split())>3 and line.split()[1].endswith(":"+upstream_port)
                                    and line.split()[3]=="0A"]
                  assert upstream_sockets, "Upstream HTTP port 8766 is not listening"
                  assert all(parts[1].startswith("0100007F:") for parts in upstream_sockets), (
                      "DANGEROUS: upstream MCP HTTP is listening on a non-loopback address",
                      upstream_sockets)
                  print("Upstream MCP 8766 confirmed loopback-only inside Docker")
              finally:
                  subprocess.run(["docker","rm","-f","moonraker-mcp-protocol"],capture_output=True)
          PY

      - name: Verify explicit history profile in running Docker gateway
        run: |
          python3 - <<'PY'
          import json, os, subprocess, tempfile, time, urllib.request, urllib.error
          with tempfile.TemporaryDirectory() as tmp:
              os.chmod(tmp,0o755)
              with open(os.path.join(tmp,"options.json"),"w") as out:
                  json.dump({"moonraker_url":"http://127.0.0.1:7125",
                             "moonraker_api_key":"","mcp_http_token":"ci-test-token",
                             "enable_history":True},out)
              subprocess.run(["docker","run","-d","--name","moonraker-mcp-history-ci",
                              "-p","127.0.0.1:18766:8765","-v",tmp+":/data:ro",
                              "moonraker-mcp:dev"],check=True,capture_output=True)
              try:
                  url="http://127.0.0.1:18766/"
                  def request(method,params=None,rid=1,session=None):
                      data={"jsonrpc":"2.0","id":rid,"method":method}
                      if params is not None: data["params"]=params
                      req=urllib.request.Request(url,data=json.dumps(data).encode(),
                          headers={"Authorization":"Bearer ci-test-token",
                                   "Content-Type":"application/json",
                                   "Accept":"application/json, text/event-stream"})
                      if session: req.add_header("Mcp-Session-Id",session)
                      with urllib.request.urlopen(req,timeout=10) as res:
                          raw=res.read().decode()
                          if "text/event-stream" in res.headers.get("Content-Type",""):
                              raw="".join(x[5:].strip() for x in raw.splitlines() if x.startswith("data:"))
                          return json.loads(raw),res.headers.get("Mcp-Session-Id")
                  for attempt in range(25):
                      try:
                          init,session=request("initialize",{"protocolVersion":"2025-06-18",
                              "capabilities":{},"clientInfo":{"name":"ci","version":"1"}},1)
                          assert "result" in init,init
                          break
                      except (urllib.error.URLError,ConnectionError):
                          time.sleep(1)
                  else: raise AssertionError("History profile gateway did not start")
                  result,_=request("tools/list",{},2,session)
                  names={x["name"] for x in result["result"]["tools"]}
                  base=set(json.load(open("moonraker_mcp/read_only_allowlist.json"))["allowed_tools"])
                  history={"moonraker_history_list","moonraker_history_job","moonraker_history_totals"}
                  assert len(base)==5,base
                  assert "moonraker_objects_query" not in names
                  assert "moonraker_objects_list" not in names
                  assert names==base|history,(names,base|history)
                  for forbidden in ("moonraker_objects_query","moonraker_objects_list",
                                    "moonraker_spoolman_status","moonraker_sensors_info",
                                    "moonraker_power_status","moonraker_gcode_script"):
                      try:
                          request("tools/call",{"name":forbidden,"arguments":{}},3,session)
                      except urllib.error.HTTPError as exc:
                          assert exc.code==403,(forbidden,exc.code)
                      else: raise AssertionError("Unexpected access: "+forbidden)
                  print("Docker history opt-in exposes exactly",len(names),"tools; other groups denied")
              finally:
                  subprocess.run(["docker","rm","-f","moonraker-mcp-history-ci"],
                                 capture_output=True)
          PY
