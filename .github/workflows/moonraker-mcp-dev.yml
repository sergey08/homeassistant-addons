name: Moonraker MCP DEV
on:
  push:
    branches: [dev/moonraker-mcp-addon]
    paths:
      - 'moonraker_mcp/**'
      - '.github/workflows/moonraker-mcp-dev.yml'
  workflow_dispatch:
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n moonraker_mcp/run.sh
      - name: Validate addon YAML
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          with open("moonraker_mcp/config.yaml") as f:
              data=yaml.safe_load(f)
          for key in ("name", "version", "slug", "arch", "options", "schema"):
              assert key in data, f"missing {key}"
          assert data["boot"] == "manual"
          assert data["ports"]["8765/tcp"] is None
          print("Add-on configuration valid")
          PY
      - name: Build DEV container (no deployment)
        run: docker build --pull --tag moonraker-mcp:dev ./moonraker_mcp
      - name: Verify binary exists
        run: |
          docker run --rm --entrypoint /usr/local/bin/mcp-raker moonraker-mcp:dev --help >/dev/null 2>&1 || {
            echo 'Binary invocation failed; inspect upstream CLI behavior.'
            exit 1
          }
