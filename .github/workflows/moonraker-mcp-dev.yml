name: Moonraker MCP DEV
on:
  push:
    branches: [dev/moonraker-mcp-addon]
    paths:
      - 'moonraker_mcp/**'
      - '.github/workflows/moonraker-mcp-dev.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: sh -n moonraker_mcp/run.sh
      - name: Validate addon YAML and required keys
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          import yaml
          with open("moonraker_mcp/config.yaml") as f:
              data=yaml.safe_load(f)
          for key in ("name","version","slug","arch","options","schema"):
              assert key in data, f"missing {key}"
          assert data["boot"] == "manual"
          print("Config YAML syntax and minimum keys OK")
          PY
      - name: Dockerfile static check
        run: |
          grep -q '^FROM ' moonraker_mcp/Dockerfile
          echo 'Static checks passed. Container build and runtime not yet verified.'
