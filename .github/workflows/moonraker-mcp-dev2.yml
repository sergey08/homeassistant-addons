name: Moonraker MCP DEV2 CI

on:
  push:
    branches:
      - dev/moonraker-mcp-dev2
      - release/moonraker-mcp-0.1.0-rc1
    paths:
      - 'moonraker_mcp/**'
      - '.github/workflows/moonraker-mcp-dev2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'moonraker_mcp/**'
      - '.github/workflows/moonraker-mcp-dev2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm64-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke-test ARM64 add-on (no deployment)
        run: |
          set -eu
          docker buildx build --platform linux/arm64 --load -t moonraker-mcp:arm64 ./moonraker_mcp
          test "$(docker image inspect moonraker-mcp:arm64 --format '{{.Architecture}}')" = arm64
          docker run --rm --platform linux/arm64 --network none --entrypoint /usr/local/bin/mcp-raker moonraker-mcp:arm64 --version
          docker run --rm --platform linux/arm64 --network none --entrypoint /opt/moonraker-mcp/vendor/tunnel-client moonraker-mcp:arm64 --version
          docker run --rm --platform linux/arm64 --network none --entrypoint sh moonraker-mcp:arm64 -c 'test "$(uname -m)" = aarch64; test -s /usr/share/doc/moonraker-mcp/licenses/tunnel-client-Apache-2.0.txt'
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell and Python syntax
        run: |
          sh -n moonraker_mcp/run.sh
          python3 -m compileall -q moonraker_mcp

      - name: Validate Home Assistant configuration and safety defaults
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import pathlib, yaml
          root = pathlib.Path("moonraker_mcp")
          cfg = yaml.safe_load((root / "config.yaml").read_text())
          assert cfg["slug"] == "moonraker_mcp"
          assert cfg["version"] == "0.1.3"
          # Gateway discovery and upstream legacy handshake must identify the
          # same add-on version; avoid stale dev7/dev11 claims in MCP clients.
          import ast
          module = ast.parse((root / "gateway.py").read_text())
          version_values = [
              node.value.value for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == "ADDON_VERSION" for t in node.targets)
              and isinstance(node.value, ast.Constant) and isinstance(node.value.value, str)
          ]
          assert version_values == [cfg["version"]], "MCP advertised version drift"
          # Every published app version needs release notes visible in the
          # Home Assistant update dialog, in English AND Spanish.
          changelog = (root / "CHANGELOG.md").read_text(encoding="utf-8")
          import re
          sections = re.split(r"(?m)^##\s+", changelog)
          assert len(sections) >= 2, "Missing bilingual app changelog sections"
          latest = sections[1]
          assert latest.startswith(cfg["version"] + " "), "Changelog newest entry must match app version"
          assert re.search(r"(?m)^### English\s*$", latest), "Changelog latest version missing English"
          assert re.search(r"(?m)^### Español\s*$", latest), "Changelog latest version missing Spanish"
          en = latest.split("### English", 1)[1].split("### Español", 1)[0]
          es = latest.split("### Español", 1)[1]
          assert len(en.strip()) >= 150 and len(es.strip()) >= 150, "Changelog entries must be detailed"

          assert set(cfg["arch"]) == {"amd64", "aarch64"}
          assert cfg["boot"] == "manual"
          assert cfg["ports"]["8765/tcp"] is None
          assert cfg["options"]["enable_tunnel"] is False
          assert cfg["options"]["mcp_http_token"] == ""
          assert cfg["options"]["moonraker_api_key"] == ""
          assert cfg["schema"]["mcp_http_token"] == "password"
          assert cfg["schema"]["openai_tunnel_api_key"] == "password?"
          assert cfg["options"]["openai_tunnel_api_key"] == ""
          for name in ("enable_jobqueue", "enable_files", "enable_objects",
                       "enable_history", "enable_sensors", "enable_spoolman", "enable_power",
                       "enable_u1_status", "enable_write_actions", "allow_print_pause", "allow_print_resume",
                       "allow_print_cancel", "allow_print_start"):
              assert cfg["options"][name] is False, name
          assert "USER root" in (root / "Dockerfile").read_text()
          assert 'ENTRYPOINT ["/run.sh"]' in (root / "Dockerfile").read_text()
          print("HA add-on config and safe defaults OK")
          PY

      - name: Run isolated unit tests
        run: |
          python3 -m unittest discover -s moonraker_mcp -p 'test_*.py' -v

      - name: Build DEV2 container without deployment
        run: |
          docker build --pull -t moonraker-mcp:ci ./moonraker_mcp
          test "$(docker image inspect moonraker-mcp:ci --format '{{.Config.User}}')" = root
          echo "Image starts as root for Supervisor options; services drop privileges."
          # Recipients of the image also receive attribution and source-access guidance.
          docker run --rm --network none --entrypoint sh moonraker-mcp:ci -c \
            'test -s /usr/share/doc/moonraker-mcp/THIRD_PARTY_NOTICES_EN_ES.md && test -s /usr/share/doc/moonraker-mcp/THIRD_PARTY_SOURCE_ACCESS_EN_ES.md && test -s /usr/share/doc/moonraker-mcp/licenses/tunnel-client-NOTICE.txt'

      - name: Inventory packaged binaries and Go module build metadata
        run: |
          set -eu
          mkdir -p moonraker-mcp-audit
          cid="$(docker create moonraker-mcp:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/mcp-raker" moonraker-mcp-audit/mcp-raker
          docker cp "$cid:/opt/moonraker-mcp/vendor/tunnel-client" moonraker-mcp-audit/tunnel-client
          docker cp "$cid:/usr/share/doc/moonraker-mcp/provenance/." moonraker-mcp-audit/
          # Public Go dependency deltas, hashes and pinned source commits.
          for name in mcp-raker tunnel-client; do
            test -f "moonraker-mcp-audit/$name-dependencies.patch"
            test -s "moonraker-mcp-audit/$name-upstream.txt"
            test -s "moonraker-mcp-audit/$name-provenance.sha256"
            (cd moonraker-mcp-audit && sha256sum -c "$name-provenance.sha256")
            grep -Fq 'resolved_x_net=golang.org/x/net v0.62.0' "moonraker-mcp-audit/$name-upstream.txt"
          done
          grep -Fq 'upstream_commit=f01636bec21a21cfc5f9ee84dc68dad7d44d6dd9' moonraker-mcp-audit/mcp-raker-upstream.txt
          grep -Fq 'upstream_commit=c2144b0904980bcbae2636cdca4f4167e9818e0b' moonraker-mcp-audit/tunnel-client-upstream.txt
          sha256sum moonraker-mcp-audit/mcp-raker moonraker-mcp-audit/tunnel-client > moonraker-mcp-audit/binary-sha256.txt
          go version -m moonraker-mcp-audit/mcp-raker > moonraker-mcp-audit/mcp-raker-modules.txt
          go version -m moonraker-mcp-audit/tunnel-client > moonraker-mcp-audit/tunnel-client-modules.txt
          grep -Eq '[[:space:]]mod[[:space:]]' moonraker-mcp-audit/mcp-raker-modules.txt
          grep -Eq '[[:space:]]mod[[:space:]]' moonraker-mcp-audit/tunnel-client-modules.txt
          rm -f moonraker-mcp-audit/mcp-raker moonraker-mcp-audit/tunnel-client
          docker run --rm --network none --entrypoint sh moonraker-mcp:ci -c 'apk info -vv' > moonraker-mcp-audit/alpine-packages.txt
          test -s moonraker-mcp-audit/alpine-packages.txt
          # Package-specific Alpine licensing: Alpine is not governed by a single
          # license that replaces the licenses of its redistributed packages.
          # APKv2's installed database supplies exact package (P), version (V)
          # and SPDX license (L) fields without a remote index/cache.
          docker run --rm --network none --entrypoint sh moonraker-mcp:ci \
            -c 'test -s /lib/apk/db/installed && awk "/^(P|V|L):/" /lib/apk/db/installed' \
            > moonraker-mcp-audit/alpine-package-metadata.txt
          test -s moonraker-mcp-audit/alpine-package-metadata.txt
          grep -q '^P:' moonraker-mcp-audit/alpine-package-metadata.txt
          grep -q '^V:' moonraker-mcp-audit/alpine-package-metadata.txt
          grep -q '^L:' moonraker-mcp-audit/alpine-package-metadata.txt
          echo 'Inventory contains binary digests, Go embedded module metadata and Alpine package names (no secrets).'

      - name: Triage exact installed Alpine licenses for manual redistribution review
        run: |
          set -eu
          python3 moonraker_mcp/alpine_license_review.py \
            moonraker-mcp-audit/alpine-package-metadata.txt moonraker-mcp-audit
          test -s moonraker-mcp-audit/alpine-license-review.csv
          test -s moonraker-mcp-audit/alpine-license-review-summary.json

      - name: Attach inventory to workflow
        uses: actions/upload-artifact@v4
        with:
          name: moonraker-mcp-dev-binary-inventory
          path: moonraker-mcp-audit/
          retention-days: 14
          if-no-files-found: error

      - name: Scan built image for vulnerabilities and third-party licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned after 2026 supply-chain incident
        with:
          image-ref: moonraker-mcp:ci
          format: json
          output: moonraker-mcp-audit/trivy-results.json
          scanners: vuln,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: 'false'

      - name: Summarize scanner findings without masking risk
        run: |
          python3 - <<'PY'
          import collections, json
          from pathlib import Path
          report=Path("moonraker-mcp-audit/trivy-results.json")
          if not report.is_file():
              raise SystemExit("SECURITY SCAN ERROR: Trivy report missing")
          data=json.loads(report.read_text())
          results=data.get("Results")
          if not isinstance(results, list):
              raise SystemExit("SECURITY SCAN ERROR: unsupported Trivy report")
          severity=collections.Counter()
          license_total=0
          license_types=collections.Counter()
          affected=[]
          license_findings=[]
          for record in results:
              for vuln in record.get("Vulnerabilities") or []:
                  severity[str(vuln.get("Severity","UNKNOWN")).upper()] += 1
                  if str(vuln.get("Severity", "")).upper() in ("CRITICAL","HIGH"):
                      affected.append((str(vuln.get("VulnerabilityID","")),str(vuln.get("PkgName","")),str(vuln.get("InstalledVersion","")),str(vuln.get("FixedVersion",""))))
              for lic in record.get("Licenses") or []:
                  license_total += 1
                  license_types[str(lic.get("Category","Unknown"))] += 1
                  if str(lic.get("Category","Unknown")).lower() in ("restricted","unknown","reciprocal"):
                      license_findings.append((str(lic.get("Name","")),str(lic.get("Category","")),str(lic.get("PkgName",record.get("Target","")))))
          summary=[
              "# Moonraker MCP container security scan",
              "",
              "Assessment only: no automatic vulnerability waivers or stable release approval.",
              "",
              "Vulnerabilities by severity:",
          ]
          for level in ("CRITICAL","HIGH","MEDIUM","LOW","UNKNOWN"):
              summary.append("- "+level+": "+str(severity[level]))
          summary += ["", "Detected license entries: "+str(license_total),
                      "License classifications: "+str(dict(sorted(license_types.items()))),
                      "", "Review full JSON artifact for affected packages, fixed versions and attribution.",
                      "", "High / critical package findings (CVE | package | installed | fixed):"]
          for item in sorted(set(affected))[:75]:
              summary.append("- "+" | ".join(item))
          summary += ["", "Restricted, reciprocal or unknown license findings (license | category | package):"]
          for item in sorted(set(license_findings))[:75]:
              summary.append("- "+" | ".join(item))
          Path("moonraker-mcp-audit/scan-summary.md").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("\n".join(summary)+"\n")
          PY

      - name: Enforce patched-image HIGH and CRITICAL vulnerability threshold
        run: |
          set -eu
          python3 moonraker_mcp/security_release_gate.py moonraker-mcp-audit/trivy-results.json

      - name: Generate CycloneDX inventory from actual DEV12 Docker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # full SHA, same reviewed scanner
        with:
          image-ref: moonraker-mcp:ci
          format: cyclonedx
          output: moonraker-mcp-audit/sbom.cdx.json
          scanners: vuln,license
          exit-code: '0'

      - name: Validate machine-readable SBOM provenance and required component types
        run: |
          python3 - <<'PY'
          import collections,json,pathlib
          p=pathlib.Path("moonraker-mcp-audit/sbom.cdx.json")
          if not p.is_file() or p.stat().st_size < 100:
              raise SystemExit("SBOM missing or empty")
          doc=json.loads(p.read_text())
          if doc.get("bomFormat")!="CycloneDX" or not doc.get("specVersion"):
              raise SystemExit("Invalid CycloneDX document")
          components=doc.get("components")
          if not isinstance(components,list) or not components:
              raise SystemExit("SBOM has no components")
          ids=[item.get("bom-ref") for item in components if isinstance(item,dict)]
          if not ids or len(set(ids)) != len(ids):
              raise SystemExit("SBOM component identifiers absent or duplicated")
          types=collections.Counter(c.get("type","unknown") for c in components)
          licenses=sum(bool(c.get("licenses")) for c in components)
          summary={"bomFormat":doc["bomFormat"],"specVersion":doc["specVersion"],
                   "components":len(components),"component_types":dict(types),
                   "components_with_license_metadata":licenses,
                   "warning":"An SBOM is not independent legal clearance or reproducible-build attestation"}
          pathlib.Path("moonraker-mcp-audit/sbom-summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Classify components missing CycloneDX license metadata
        run: |
          set -eu
          python3 moonraker_mcp/sbom_license_queue.py \
            moonraker-mcp-audit/sbom.cdx.json moonraker-mcp-audit
          test -s moonraker-mcp-audit/license-review-queue.csv
          test -s moonraker-mcp-audit/license-review-summary.json

      - name: Verify original source license file evidence for exact Go modules
        run: |
          set -eu
          # Public module downloads only. This reads files; it never executes
          # dependency code or assigns guessed license identifiers.
          python3 moonraker_mcp/go_license_evidence.py \
            moonraker-mcp-audit/license-review-queue.csv moonraker-mcp-audit
          test -s moonraker-mcp-audit/go-license-evidence.csv
          test -s moonraker-mcp-audit/go-license-evidence-summary.json

      - name: Archive verified original Go LICENSE and NOTICE texts for maintainer review
        run: |
          set -eu
          python3 moonraker_mcp/legal_text_bundle.py \
            moonraker-mcp-audit/go-license-evidence.csv \
            moonraker-mcp-audit/third-party-legal-texts.zip
          test -s moonraker-mcp-audit/third-party-legal-texts.zip
          test -s moonraker-mcp-audit/legal-text-bundle-summary.json

      - name: Generate unapproved reviewer worksheet for exact image SBOM
        run: |
          set -eu
          python3 moonraker_mcp/license_review_worksheet.py \
            moonraker-mcp-audit/sbom.cdx.json moonraker-mcp-audit
          test -s moonraker-mcp-audit/license-human-review-worksheet.csv
          test -s moonraker-mcp-audit/license-review-pending.json
          # The generated worksheet is deliberately NOT an approval.
          if python3 moonraker_mcp/license_release_gate.py \
              moonraker-mcp-audit/sbom.cdx.json \
              moonraker-mcp-audit/license-review-pending.json; then
            echo "SECURITY FAILURE: pending worksheet was accepted as an approval"
            exit 1
          fi

      - name: Reconcile upstream license evidence with exact SBOM without approving it
        run: |
          set -eu
          python3 moonraker_mcp/license_review_prefill.py \
            moonraker-mcp-audit/license-review-pending.json \
            moonraker-mcp-audit/go-license-evidence.csv \
            moonraker-mcp-audit/alpine-license-review.csv \
            moonraker-mcp-audit/license-review-evidence-hints.json
          test -s moonraker-mcp-audit/license-review-evidence-hints.json
          python3 - <<'PY'
          import json
          p="moonraker-mcp-audit/license-review-evidence-hints.json"
          data=json.load(open(p))
          assert data["purpose"] == "EVIDENCE_HINTS_ONLY_NOT_LICENSE_APPROVAL"
          assert data["reviewer_approved"] is False
          assert data["components"]
          assert all(x["status"] == "PENDING" and x["human_review_required"] for x in data["components"])
          print("Evidence hints never clear license review")
          PY

      - name: Confirm stable license-documentation gate is closed without manual reviews
        run: |
          set -eu
          # Every future stable release must have an exact-SBOM review manifest.
          # This development job expects the release gate to refuse missing
          # approvals; it MUST NOT silently authorize distribution.
          if python3 moonraker_mcp/license_release_gate.py \
              moonraker-mcp-audit/sbom.cdx.json \
              moonraker-mcp-audit/license-reviewed-approvals.json; then
            echo "SECURITY FAILURE: stable license gate accepted missing approvals"
            exit 1
          fi
          echo "Stable release remains blocked until exact-SBOM manual legal review"

      - name: Retain unapproved candidate SBOM and license evidence for human review
        uses: actions/upload-artifact@v4
        with:
          name: moonraker-mcp-dev12-cyclonedx-sbom
          path: |
            moonraker-mcp-audit/sbom.cdx.json
            moonraker-mcp-audit/sbom-summary.json
            moonraker-mcp-audit/license-review-queue.csv
            moonraker-mcp-audit/license-review-summary.json
            moonraker-mcp-audit/go-license-evidence.csv
            moonraker-mcp-audit/go-license-evidence-summary.json
            moonraker-mcp-audit/third-party-legal-texts.zip
            moonraker-mcp-audit/legal-text-bundle-summary.json
            moonraker-mcp-audit/license-human-review-worksheet.csv
            moonraker-mcp-audit/license-review-pending.json
            moonraker-mcp-audit/license-review-evidence-hints.json
            moonraker-mcp-audit/trivy-results.json
            moonraker-mcp-audit/scan-summary.md
          retention-days: 14
          if-no-files-found: error

      - name: Verify redistribution notices are present inside image
        run: |
          set -eu
          docker run --rm --entrypoint sh moonraker-mcp:ci -c '
            set -eu
            d=/usr/share/doc/moonraker-mcp/licenses
            test -s "$d/mcp-raker-BSD-3-Clause.txt"
            test -s "$d/go-toolchain-BSD-3-Clause.txt"
            grep -q "Copyright 2009 The Go Authors" "$d/go-toolchain-BSD-3-Clause.txt"
            test -s "$d/tunnel-client-Apache-2.0.txt"
            test -s "$d/tunnel-client-NOTICE.txt"
            grep -q "BSD 3-Clause License" "$d/mcp-raker-BSD-3-Clause.txt"
            grep -q "Apache License" "$d/tunnel-client-Apache-2.0.txt"
            grep -q "Copyright 2026 OpenAI" "$d/tunnel-client-NOTICE.txt"
          '
          echo "Upstream license and NOTICE files included in redistribution"

      - name: Regression-test legacy official OpenAI tunnel-client v0.0.19 provisioning (offline; not shipped)
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          # UID 65534 owns private tunnel assets, so host cleanup needs privileges.
          trap 'sudo rm -rf -- "$tmpdir"' EXIT
          chmod 755 "$tmpdir"
          mkdir -p "$tmpdir/incoming"
          curl --fail --location --show-error --silent --retry 3 --max-time 120 \
            "https://github.com/openai/tunnel-client/releases/download/v0.0.19/tunnel-client-v0.0.19-linux-amd64.zip" \
            -o "$tmpdir/incoming/tunnel-client-v0.0.19-linux-amd64.zip"
          curl --fail --location --show-error --silent --retry 3 --max-time 45 \
            "https://github.com/openai/tunnel-client/releases/download/v0.0.19/SHA256SUMS.txt" \
            -o "$tmpdir/incoming/SHA256SUMS.txt"
          echo "9ee9448592345a9dd1517fb79791ab54d24f051142eb92bcbe8cd355effc9142  $tmpdir/incoming/tunnel-client-v0.0.19-linux-amd64.zip" | sha256sum -c -
          docker run --rm --network none -v "$tmpdir:/data" \
            --entrypoint python3 moonraker-mcp:ci \
            /opt/moonraker-mcp/tunnel_provision.py --base /data install \
            --archive /data/incoming/tunnel-client-v0.0.19-linux-amd64.zip \
            --manifest /data/incoming/SHA256SUMS.txt
          docker run --rm --network none -v "$tmpdir:/data:ro" \
            --entrypoint su-exec moonraker-mcp:ci 65534:65534 \
            /data/tunnel/bin/tunnel-client --version
          echo "Legacy v0.0.19 archive accepted by isolated offline migration test; DEV12 ships source-built patched v0.0.20"

      - name: Refuse insecure tunnel startup before opening any listener
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          trap 'sudo rm -rf "$tmpdir"' EXIT
          chmod 755 "$tmpdir"
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-local-only-token","enable_tunnel":true,"tunnel_id":"ci-placeholder"}' > "$tmpdir/options.json"
          if docker run --rm --network none -v "$tmpdir:/data" moonraker-mcp:ci >"$tmpdir/output" 2>&1; then
            echo "SECURITY FAILURE: tunnel launched without client or key"
            exit 1
          fi
          grep -q 'Configure OpenAI tunnel API key in Home Assistant' "$tmpdir/output"
          echo "Fail-closed tunnel preflight verified without printer or network"

      - name: Clean first-run tunnel provisioning without terminal or network
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          trap 'sudo rm -rf -- "$tmpdir"' EXIT
          chmod 755 "$tmpdir"
          # Only Home Assistant-style options are provided. No manual tunnel
          # client executable, /data/tunnel directory, or precreated key.
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-only-local-token","enable_tunnel":true,"tunnel_id":"ci-fake-tunnel","openai_tunnel_api_key":"ci-synthetic-restricted-key-123456"}' > "$tmpdir/options.json"
          chmod 600 "$tmpdir/options.json"
          # A fake tunnel ID cannot connect to OpenAI in --network none.
          # The add-on is expected to stop; automatic local provisioning
          # must have happened securely before the startup failure.
          timeout 25s docker run --rm --network none --stop-timeout 12 \
            -v "$tmpdir:/data" moonraker-mcp:ci >"$tmpdir/output.log" 2>&1 || true
          docker run --rm --network none -v "$tmpdir:/data:ro" \
            --entrypoint python3 moonraker-mcp:ci -c '
          import os, pathlib, stat
          base=pathlib.Path("/data/tunnel")
          key=base/"api-key"
          exe=base/"bin/tunnel-client"
          assert key.is_file() and not key.is_symlink()
          assert exe.is_file() and not exe.is_symlink()
          assert key.read_bytes() == b"ci-synthetic-restricted-key-123456"
          assert stat.S_IMODE(key.stat().st_mode) == 0o600
          assert stat.S_IMODE(exe.stat().st_mode) == 0o700
          assert key.stat().st_uid == 65534
          assert exe.stat().st_uid == 65534
          assert exe.stat().st_size > 100000
          print("Clean options-only provisioning created private key and executable")
          '
          if grep -q 'ci-synthetic-restricted-key-123456' "$tmpdir/output.log"; then
            echo "SECURITY FAILURE: synthetic tunnel secret appeared in logs"
            exit 1
          fi
          echo "No synthetic key leaked to startup logs; no OpenAI/printer network access"

      - name: Stop add-on when a simulated tunnel process exits
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          cleanup() {
            docker rm -f moonraker-mcp-tunnel-exit >/dev/null 2>&1 || true
            sudo rm -rf "$tmpdir"
          }
          trap cleanup EXIT
          mkdir -p "$tmpdir/tunnel/bin"
          chmod 755 "$tmpdir" "$tmpdir/tunnel" "$tmpdir/tunnel/bin"
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-local-only-token","enable_tunnel":true,"tunnel_id":"ci-mock-only"}' > "$tmpdir/options.json"
          printf '#!/bin/sh\nexit 0\n' > "$tmpdir/tunnel/bin/tunnel-client"
          chmod 700 "$tmpdir/tunnel/bin/tunnel-client"
          printf 'ci-only-fake-key-12345' > "$tmpdir/tunnel/api-key"
          chmod 600 "$tmpdir/tunnel/api-key"
          docker run --rm -v "$tmpdir:/data" --entrypoint chown moonraker-mcp:ci 65534:65534 /data/tunnel/api-key /data/tunnel/bin/tunnel-client
          docker run -d --name moonraker-mcp-tunnel-exit --network none \
            -v "$tmpdir:/data" moonraker-mcp:ci >/dev/null
          python3 - <<'PY'
          import subprocess,time
          name="moonraker-mcp-tunnel-exit"
          for _ in range(45):
              value=subprocess.check_output(["docker","inspect","-f","{{.State.Status}} {{.State.ExitCode}}",name],text=True).strip()
              status,code=value.split()
              if status == "exited":
                  assert code != "0", "Supervisor must report failure after tunnel-client exits"
                  logs=subprocess.check_output(["docker","logs",name],stderr=subprocess.STDOUT,text=True)
                  assert "Required Moonraker MCP process" in logs, "Supervisor did not detect a child exit"
                  print("Simulated tunnel exit stopped the add-on with failure, as required")
                  break
              time.sleep(1)
          else:
              raise AssertionError("Add-on remained running after tunnel-client exited")
          PY

      - name: Check runtime health and auth without a printer
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          cleanup() {
            docker rm -f moonraker-mcp-ci >/dev/null 2>&1 || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT
          chmod 700 "$tmpdir"
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-local-only-token","enable_tunnel":false}' > "$tmpdir/options.json"
          chmod 600 "$tmpdir/options.json"
          docker run -d --name moonraker-mcp-ci --network none \
            -v "$tmpdir:/data:ro" moonraker-mcp:ci >/dev/null
          for i in $(seq 1 30); do
            if docker exec moonraker-mcp-ci python3 -c '
          import urllib.error,urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=1)
          except urllib.error.HTTPError as e:
              raise SystemExit(0 if e.code == 401 else 1)
          except Exception:
              raise SystemExit(1)
          raise SystemExit(1)
          '; then
              echo "Unauthenticated /health rejected with HTTP 401"
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs moonraker-mcp-ci
              exit 1
            fi
            sleep 1
          done
          docker exec moonraker-mcp-ci python3 -c 'import os; pids=[p for p in os.listdir("/proc") if p.isdigit() and os.path.exists("/proc/"+p+"/cmdline") and b"gateway.py" in open("/proc/"+p+"/cmdline","rb").read().split(bytes([0]))]; assert pids and all(int(open("/proc/"+p+"/status").read().split("Uid:")[1].split()[0]) == 65534 for p in pids), pids' || {
            echo "Gateway privileges check failed"
            exit 1
          }
          echo "Gateway process is unprivileged; no printer contacted"

  alpine-source-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact aports commit with sparse source directories
        run: |
          set -eu
          APORTS_SHA=2235ae248c31ea48a9df764becdfecc2a85b4f31
          mkdir -p /tmp/alpine-aports
          git -C /tmp/alpine-aports init
          git -C /tmp/alpine-aports remote add origin https://github.com/alpinelinux/aports.git
          git -C /tmp/alpine-aports -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$APORTS_SHA"
          git -C /tmp/alpine-aports sparse-checkout init --cone
          git -C /tmp/alpine-aports sparse-checkout set \
            main/alpine-baselayout main/apk-tools main/busybox main/ca-certificates \
            main/gdbm main/gcc main/musl main/readline main/pax-utils main/xz
          git -C /tmp/alpine-aports checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpine-aports rev-parse HEAD)" = "$APORTS_SHA"
      - name: Verify local aports checksums, not external sources or legal approval
        run: |
          python3 moonraker_mcp/alpine_source_integrity.py \
            /tmp/alpine-aports moonraker-mcp-audit/alpine-source-integrity.json
      - name: Archive Alpine source integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: moonraker-mcp-alpine-source-integrity
          path: moonraker-mcp-audit/alpine-source-integrity.json
          retention-days: 14
          if-no-files-found: error

  # Remote GNU hosting can be unavailable from GitHub runners. Run explicitly
  # on demand; preserve strict SHA-512 verification, never silently PASS.
  readline-remote-integrity:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Alpine Readline source recipe
        run: |
          set -eu
          SHA=2235ae248c31ea48a9df764becdfecc2a85b4f31
          mkdir -p /tmp/alpine-aports
          git -C /tmp/alpine-aports init
          git -C /tmp/alpine-aports remote add origin https://github.com/alpinelinux/aports.git
          git -C /tmp/alpine-aports -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$SHA"
          git -C /tmp/alpine-aports sparse-checkout init --cone
          git -C /tmp/alpine-aports sparse-checkout set main/readline
          git -C /tmp/alpine-aports checkout --detach FETCH_HEAD
          test "$(git -C /tmp/alpine-aports rev-parse HEAD)" = "$SHA"
      - name: Verify SHA512 of 13 upstream GNU patches without executing downloads
        run: |
          python3 moonraker_mcp/readline_patch_integrity.py \
            /tmp/alpine-aports/main/readline/APKBUILD \
            moonraker-mcp-audit/readline-remote-integrity.json
      - name: Archive verified GNU patch provenance
        uses: actions/upload-artifact@v4
        with:
          name: moonraker-mcp-readline-remote-integrity
          path: moonraker-mcp-audit/readline-remote-integrity.json
          retention-days: 14
          if-no-files-found: error

  # Network-intensive source archive checks are explicit, not part of routine
  # code CI. An unavailable remote host must not be reported as a PASS.
  # While this workflow exists only on the DEV branch, workflow_dispatch cannot
  # be triggered from GitHub's UI. An intentional [source-audit] push enables
  # this independent, fail-closed source check without touching main.
  alpine-remote-source-integrity:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[source-audit]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify the 11 externally hosted source archives and netbase files
        run: |
          python3 moonraker_mcp/alpine_remote_source_integrity.py \
            moonraker_mcp/alpine-external-sources-pending.json \
            moonraker-mcp-audit/alpine-remote-source-integrity.json
      - name: Retain partial or successful remote checksum evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonraker-mcp-alpine-remote-source-integrity
          path: moonraker-mcp-audit/alpine-remote-source-integrity.json
          retention-days: 14
          if-no-files-found: error

  # Explicit source-material collection for release review; does not run on normal pushes.
  # This archive contains pinned upstream Go source, module cache, and Alpine
  # APKBUILD recipes/patches. It does NOT claim to contain all Alpine upstream
  # tarballs or constitute a complete GPL corresponding-source offer.
  release-source-material:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[source-bundle]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: Gather pinned upstream Go source and actual module dependency sources
        run: |
          set -eu
          mkdir -p /tmp/moonraker-release-sources/go /tmp/moonraker-release-sources/alpine
          for spec in \
              'mcp-raker|https://github.com/lexfrei/mcp-raker.git|f01636bec21a21cfc5f9ee84dc68dad7d44d6dd9' \
              'tunnel-client|https://github.com/openai/tunnel-client.git|c2144b0904980bcbae2636cdca4f4167e9818e0b'; do
            name="${spec%%|*}"
            rest="${spec#*|}"
            url="${rest%%|*}"
            sha="${rest##*|}"
            dir="/tmp/moonraker-release-sources/go/$name"
            mkdir -p "$dir"
            git -C "$dir" init -q
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth=1 origin "$sha"
            git -C "$dir" checkout -q --detach FETCH_HEAD
            test "$(git -C "$dir" rev-parse HEAD)" = "$sha"
            (cd "$dir" && go get golang.org/x/net@v0.62.0 && go mod download && go mod verify && go list -m all > MODULES.txt && git diff -- go.mod go.sum > SECURITY_DEPENDENCY_CHANGES.patch)
            printf '%s\n' "$url" "$sha" > "$dir/UPSTREAM_REVISION.txt"
            rm -rf "$dir/.git"
          done
          mkdir -p /tmp/moonraker-release-sources/go-module-downloads
          cp -a "$(go env GOPATH)/pkg/mod/cache/download/." /tmp/moonraker-release-sources/go-module-downloads/
          test -s /tmp/moonraker-release-sources/go/mcp-raker/MODULES.txt
          test -s /tmp/moonraker-release-sources/go/tunnel-client/MODULES.txt
      - name: Gather pinned Alpine build recipes and local source patches
        run: |
          set -eu
          APORTS_SHA=2235ae248c31ea48a9df764becdfecc2a85b4f31
          dir=/tmp/release-aports
          git init -q "$dir"
          git -C "$dir" remote add origin https://github.com/alpinelinux/aports.git
          git -C "$dir" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$APORTS_SHA"
          git -C "$dir" sparse-checkout init --cone
          git -C "$dir" sparse-checkout set \
            main/alpine-baselayout main/apk-tools main/busybox main/ca-certificates \
            main/gdbm main/gcc main/musl main/readline main/pax-utils main/xz
          git -C "$dir" checkout -q --detach FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$APORTS_SHA"
          cp -a "$dir/main/." /tmp/moonraker-release-sources/alpine/
          printf '%s\n' "$APORTS_SHA" > /tmp/moonraker-release-sources/alpine/APORTS_COMMIT.txt
          python3 moonraker_mcp/alpine_source_integrity.py "$dir" /tmp/moonraker-release-sources/alpine-local-integrity.json
      - name: Retain SHA512-verified Alpine external sources when available
        run: |
          set -eu
          python3 moonraker_mcp/alpine_remote_bundle.py \
            moonraker_mcp/alpine-external-sources-pending.json \
            /tmp/moonraker-release-sources/alpine-remote
          test -s /tmp/moonraker-release-sources/alpine-remote/MANIFEST.json
          # This is evidence collection; missing remote files do not become PASS.
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/moonraker-release-sources/alpine-remote/MANIFEST.json')
          r = json.loads(p.read_text())
          assert r['corresponding_source_complete'] is False
          assert r['license_approved'] is False
          assert r['verified'] + r['unverified'] == 11
          print('Alpine remote review evidence:', r['verified'], '/11')
          PY
      - name: Retain 13 GNU Readline patches only after exact source SHA512
        run: |
          set -eu
          python3 moonraker_mcp/readline_patch_integrity.py \
            /tmp/release-aports/main/readline/APKBUILD \
            /tmp/moonraker-release-sources/readline-remote-integrity.json \
            --retain-dir /tmp/moonraker-release-sources/readline-patches
          test "$(find /tmp/moonraker-release-sources/readline-patches -type f | wc -l)" -eq 13
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/moonraker-release-sources/readline-remote-integrity.json').read_text())
          assert r['verified_remote_sha512'] == 13
          assert r['license_approved'] is False
          PY
      - name: Record limits, create checksum and source-material tarball
        run: |
          set -eu
          cp moonraker_mcp/THIRD_PARTY_NOTICES_EN_ES.md /tmp/moonraker-release-sources/
          cp moonraker_mcp/THIRD_PARTY_SOURCE_ACCESS_EN_ES.md /tmp/moonraker-release-sources/
          cat > /tmp/moonraker-release-sources/README_INCOMPLETE_SOURCE_MATERIAL.txt <<'EOF'
          RELEASE REVIEW SOURCE MATERIAL — NOT A COMPLETE CORRESPONDING-SOURCE OFFER.
          Contains pinned mcp-raker / tunnel-client source trees after documented
          Go dependency updates, downloaded Go module cache, and Alpine APKBUILD
          files plus local patches for ten prioritized source families.
          This archive DOES NOT include all original Alpine upstream tarballs,
          all installed Alpine package sources, or a complete license compliance
          determination. Do not present it as complete for GPL/LGPL/MPL.
          No user credentials or Home Assistant runtime data are included.
          EOF
          mkdir -p moonraker-mcp-source-review
          tar -C /tmp -czf moonraker-mcp-source-review/source-material-rc1.tar.gz moonraker-release-sources
          (cd moonraker-mcp-source-review && sha256sum source-material-rc1.tar.gz > SHA256SUMS)
          test -s moonraker-mcp-source-review/source-material-rc1.tar.gz
      - name: Retain review bundle (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: moonraker-mcp-rc1-source-material-INCOMPLETE
          path: moonraker-mcp-source-review/
          retention-days: 14
          if-no-files-found: error
