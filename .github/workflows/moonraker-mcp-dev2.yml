name: Moonraker MCP DEV2 CI

on:
  push:
    branches:
      - dev/moonraker-mcp-dev2
    paths:
      - 'moonraker_mcp/**'
      - '.github/workflows/moonraker-mcp-dev2.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'moonraker_mcp/**'
      - '.github/workflows/moonraker-mcp-dev2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell and Python syntax
        run: |
          sh -n moonraker_mcp/run.sh
          python3 -m compileall -q moonraker_mcp

      - name: Validate Home Assistant configuration and safety defaults
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 - <<'PY'
          import pathlib, yaml
          root = pathlib.Path("moonraker_mcp")
          cfg = yaml.safe_load((root / "config.yaml").read_text())
          assert cfg["slug"] == "moonraker_mcp"
          assert cfg["version"] == "0.1.0-dev11"
          assert cfg["boot"] == "manual"
          assert cfg["ports"]["8765/tcp"] is None
          assert cfg["options"]["enable_tunnel"] is False
          assert cfg["options"]["mcp_http_token"] == ""
          assert cfg["options"]["moonraker_api_key"] == ""
          assert cfg["schema"]["mcp_http_token"] == "password"
          assert cfg["schema"]["openai_tunnel_api_key"] == "password?"
          assert cfg["options"]["openai_tunnel_api_key"] == ""
          for name in ("enable_jobqueue", "enable_files", "enable_objects",
                       "enable_history", "enable_sensors", "enable_spoolman", "enable_power"):
              assert cfg["options"][name] is False, name
          assert "USER root" in (root / "Dockerfile").read_text()
          assert 'ENTRYPOINT ["/run.sh"]' in (root / "Dockerfile").read_text()
          print("HA add-on config and safe defaults OK")
          PY

      - name: Run isolated unit tests
        run: |
          python3 -m unittest discover -s moonraker_mcp -p 'test_*.py' -v

      - name: Build DEV2 container without deployment
        run: |
          docker build --pull -t moonraker-mcp:ci ./moonraker_mcp
          test "$(docker image inspect moonraker-mcp:ci --format '{{.Config.User}}')" = root
          echo "Image starts as root for Supervisor options; services drop privileges."

      - name: Inventory packaged binaries and Go module build metadata
        run: |
          set -eu
          mkdir -p moonraker-mcp-audit
          cid="$(docker create moonraker-mcp:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/local/bin/mcp-raker" moonraker-mcp-audit/mcp-raker
          docker cp "$cid:/opt/moonraker-mcp/vendor/tunnel-client" moonraker-mcp-audit/tunnel-client
          sha256sum moonraker-mcp-audit/mcp-raker moonraker-mcp-audit/tunnel-client > moonraker-mcp-audit/binary-sha256.txt
          go version -m moonraker-mcp-audit/mcp-raker > moonraker-mcp-audit/mcp-raker-modules.txt
          go version -m moonraker-mcp-audit/tunnel-client > moonraker-mcp-audit/tunnel-client-modules.txt
          grep -Eq '[[:space:]]mod[[:space:]]' moonraker-mcp-audit/mcp-raker-modules.txt
          grep -Eq '[[:space:]]mod[[:space:]]' moonraker-mcp-audit/tunnel-client-modules.txt
          rm -f moonraker-mcp-audit/mcp-raker moonraker-mcp-audit/tunnel-client
          docker run --rm --network none --entrypoint sh moonraker-mcp:ci -c 'apk info -vv' > moonraker-mcp-audit/alpine-packages.txt
          test -s moonraker-mcp-audit/alpine-packages.txt
          echo 'Inventory contains binary digests, Go embedded module metadata and Alpine package names (no secrets).'

      - name: Attach inventory to workflow
        uses: actions/upload-artifact@v4
        with:
          name: moonraker-mcp-dev-binary-inventory
          path: moonraker-mcp-audit/
          retention-days: 14
          if-no-files-found: error

      - name: Scan built image for vulnerabilities and third-party licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned after 2026 supply-chain incident
        with:
          image-ref: moonraker-mcp:ci
          format: json
          output: moonraker-mcp-audit/trivy-results.json
          scanners: vuln,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: 'false'

      - name: Summarize scanner findings without masking risk
        run: |
          python3 - <<'PY'
          import collections, json
          from pathlib import Path
          report=Path("moonraker-mcp-audit/trivy-results.json")
          if not report.is_file():
              raise SystemExit("SECURITY SCAN ERROR: Trivy report missing")
          data=json.loads(report.read_text())
          results=data.get("Results")
          if not isinstance(results, list):
              raise SystemExit("SECURITY SCAN ERROR: unsupported Trivy report")
          severity=collections.Counter()
          license_total=0
          license_types=collections.Counter()
          affected=[]
          license_findings=[]
          for record in results:
              for vuln in record.get("Vulnerabilities") or []:
                  severity[str(vuln.get("Severity","UNKNOWN")).upper()] += 1
                  if str(vuln.get("Severity", "")).upper() in ("CRITICAL","HIGH"):
                      affected.append((str(vuln.get("VulnerabilityID","")),str(vuln.get("PkgName","")),str(vuln.get("InstalledVersion","")),str(vuln.get("FixedVersion",""))))
              for lic in record.get("Licenses") or []:
                  license_total += 1
                  license_types[str(lic.get("Category","Unknown"))] += 1
                  if str(lic.get("Category","Unknown")).lower() in ("restricted","unknown","reciprocal"):
                      license_findings.append((str(lic.get("Name","")),str(lic.get("Category","")),str(lic.get("PkgName",record.get("Target","")))))
          summary=[
              "# Moonraker MCP container security scan",
              "",
              "Assessment only: no automatic vulnerability waivers or stable release approval.",
              "",
              "Vulnerabilities by severity:",
          ]
          for level in ("CRITICAL","HIGH","MEDIUM","LOW","UNKNOWN"):
              summary.append("- "+level+": "+str(severity[level]))
          summary += ["", "Detected license entries: "+str(license_total),
                      "License classifications: "+str(dict(sorted(license_types.items()))),
                      "", "Review full JSON artifact for affected packages, fixed versions and attribution.",
                      "", "High / critical package findings (CVE | package | installed | fixed):"]
          for item in sorted(set(affected))[:75]:
              summary.append("- "+" | ".join(item))
          summary += ["", "Restricted, reciprocal or unknown license findings (license | category | package):"]
          for item in sorted(set(license_findings))[:75]:
              summary.append("- "+" | ".join(item))
          Path("moonraker-mcp-audit/scan-summary.md").write_text("\n".join(summary)+"\n")
          print("\n".join(summary))
          with Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
              output.write("\n".join(summary)+"\n")
          PY

      - name: Verify redistribution notices are present inside image
        run: |
          set -eu
          docker run --rm --entrypoint sh moonraker-mcp:ci -c '
            set -eu
            d=/usr/share/doc/moonraker-mcp/licenses
            test -s "$d/mcp-raker-BSD-3-Clause.txt"
            test -s "$d/tunnel-client-Apache-2.0.txt"
            test -s "$d/tunnel-client-NOTICE.txt"
            grep -q "BSD 3-Clause License" "$d/mcp-raker-BSD-3-Clause.txt"
            grep -q "Apache License" "$d/tunnel-client-Apache-2.0.txt"
            grep -q "Copyright 2026 OpenAI" "$d/tunnel-client-NOTICE.txt"
          '
          echo "Upstream license and NOTICE files included in redistribution"

      - name: Verify official OpenAI tunnel-client v0.0.19 in Alpine (offline runtime)
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          # UID 65534 owns private tunnel assets, so host cleanup needs privileges.
          trap 'sudo rm -rf -- "$tmpdir"' EXIT
          chmod 755 "$tmpdir"
          mkdir -p "$tmpdir/incoming"
          curl --fail --location --show-error --silent --retry 3 --max-time 120 \
            "https://github.com/openai/tunnel-client/releases/download/v0.0.19/tunnel-client-v0.0.19-linux-amd64.zip" \
            -o "$tmpdir/incoming/tunnel-client-v0.0.19-linux-amd64.zip"
          curl --fail --location --show-error --silent --retry 3 --max-time 45 \
            "https://github.com/openai/tunnel-client/releases/download/v0.0.19/SHA256SUMS.txt" \
            -o "$tmpdir/incoming/SHA256SUMS.txt"
          echo "9ee9448592345a9dd1517fb79791ab54d24f051142eb92bcbe8cd355effc9142  $tmpdir/incoming/tunnel-client-v0.0.19-linux-amd64.zip" | sha256sum -c -
          docker run --rm --network none -v "$tmpdir:/data" \
            --entrypoint python3 moonraker-mcp:ci \
            /opt/moonraker-mcp/tunnel_provision.py --base /data install \
            --archive /data/incoming/tunnel-client-v0.0.19-linux-amd64.zip \
            --manifest /data/incoming/SHA256SUMS.txt
          docker run --rm --network none -v "$tmpdir:/data:ro" \
            --entrypoint su-exec moonraker-mcp:ci 65534:65534 \
            /data/tunnel/bin/tunnel-client --version
          echo "Official v0.0.19 executable verified and launched on Alpine without OpenAI or printer connectivity"

      - name: Refuse insecure tunnel startup before opening any listener
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          trap 'sudo rm -rf "$tmpdir"' EXIT
          chmod 755 "$tmpdir"
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-local-only-token","enable_tunnel":true,"tunnel_id":"ci-placeholder"}' > "$tmpdir/options.json"
          if docker run --rm --network none -v "$tmpdir:/data" moonraker-mcp:ci >"$tmpdir/output" 2>&1; then
            echo "SECURITY FAILURE: tunnel launched without client or key"
            exit 1
          fi
          grep -q 'Configure OpenAI tunnel API key in Home Assistant' "$tmpdir/output"
          echo "Fail-closed tunnel preflight verified without printer or network"

      - name: Clean first-run tunnel provisioning without terminal or network
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          trap 'sudo rm -rf -- "$tmpdir"' EXIT
          chmod 755 "$tmpdir"
          # Only Home Assistant-style options are provided. No manual tunnel
          # client executable, /data/tunnel directory, or precreated key.
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-only-local-token","enable_tunnel":true,"tunnel_id":"ci-fake-tunnel","openai_tunnel_api_key":"ci-synthetic-restricted-key-123456"}' > "$tmpdir/options.json"
          chmod 600 "$tmpdir/options.json"
          # A fake tunnel ID cannot connect to OpenAI in --network none.
          # The add-on is expected to stop; automatic local provisioning
          # must have happened securely before the startup failure.
          timeout 25s docker run --rm --network none --stop-timeout 12 \
            -v "$tmpdir:/data" moonraker-mcp:ci >"$tmpdir/output.log" 2>&1 || true
          docker run --rm --network none -v "$tmpdir:/data:ro" \
            --entrypoint python3 moonraker-mcp:ci -c '
          import os, pathlib, stat
          base=pathlib.Path("/data/tunnel")
          key=base/"api-key"
          exe=base/"bin/tunnel-client"
          assert key.is_file() and not key.is_symlink()
          assert exe.is_file() and not exe.is_symlink()
          assert key.read_bytes() == b"ci-synthetic-restricted-key-123456"
          assert stat.S_IMODE(key.stat().st_mode) == 0o600
          assert stat.S_IMODE(exe.stat().st_mode) == 0o700
          assert key.stat().st_uid == 65534
          assert exe.stat().st_uid == 65534
          assert exe.stat().st_size > 100000
          print("Clean options-only provisioning created private key and executable")
          '
          if grep -q 'ci-synthetic-restricted-key-123456' "$tmpdir/output.log"; then
            echo "SECURITY FAILURE: synthetic tunnel secret appeared in logs"
            exit 1
          fi
          echo "No synthetic key leaked to startup logs; no OpenAI/printer network access"

      - name: Stop add-on when a simulated tunnel process exits
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          cleanup() {
            docker rm -f moonraker-mcp-tunnel-exit >/dev/null 2>&1 || true
            sudo rm -rf "$tmpdir"
          }
          trap cleanup EXIT
          mkdir -p "$tmpdir/tunnel/bin"
          chmod 755 "$tmpdir" "$tmpdir/tunnel" "$tmpdir/tunnel/bin"
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-local-only-token","enable_tunnel":true,"tunnel_id":"ci-mock-only"}' > "$tmpdir/options.json"
          printf '#!/bin/sh\nexit 0\n' > "$tmpdir/tunnel/bin/tunnel-client"
          chmod 700 "$tmpdir/tunnel/bin/tunnel-client"
          printf 'ci-only-fake-key-12345' > "$tmpdir/tunnel/api-key"
          chmod 600 "$tmpdir/tunnel/api-key"
          docker run --rm -v "$tmpdir:/data" --entrypoint chown moonraker-mcp:ci 65534:65534 /data/tunnel/api-key /data/tunnel/bin/tunnel-client
          docker run -d --name moonraker-mcp-tunnel-exit --network none \
            -v "$tmpdir:/data" moonraker-mcp:ci >/dev/null
          python3 - <<'PY'
          import subprocess,time
          name="moonraker-mcp-tunnel-exit"
          for _ in range(45):
              value=subprocess.check_output(["docker","inspect","-f","{{.State.Status}} {{.State.ExitCode}}",name],text=True).strip()
              status,code=value.split()
              if status == "exited":
                  assert code != "0", "Supervisor must report failure after tunnel-client exits"
                  logs=subprocess.check_output(["docker","logs",name],stderr=subprocess.STDOUT,text=True)
                  assert "Required Moonraker MCP process" in logs, "Supervisor did not detect a child exit"
                  print("Simulated tunnel exit stopped the add-on with failure, as required")
                  break
              time.sleep(1)
          else:
              raise AssertionError("Add-on remained running after tunnel-client exited")
          PY

      - name: Check runtime health and auth without a printer
        run: |
          set -eu
          tmpdir="$(mktemp -d)"
          cleanup() {
            docker rm -f moonraker-mcp-ci >/dev/null 2>&1 || true
            rm -rf "$tmpdir"
          }
          trap cleanup EXIT
          chmod 700 "$tmpdir"
          printf '%s\n' '{"moonraker_url":"http://127.0.0.1:7125","moonraker_api_key":"","mcp_http_token":"ci-local-only-token","enable_tunnel":false}' > "$tmpdir/options.json"
          chmod 600 "$tmpdir/options.json"
          docker run -d --name moonraker-mcp-ci --network none \
            -v "$tmpdir:/data:ro" moonraker-mcp:ci >/dev/null
          for i in $(seq 1 30); do
            if docker exec moonraker-mcp-ci python3 -c '
          import urllib.error,urllib.request
          try:
              urllib.request.urlopen("http://127.0.0.1:8765/health", timeout=1)
          except urllib.error.HTTPError as e:
              raise SystemExit(0 if e.code == 401 else 1)
          except Exception:
              raise SystemExit(1)
          raise SystemExit(1)
          '; then
              echo "Unauthenticated /health rejected with HTTP 401"
              break
            fi
            if [ "$i" -eq 30 ]; then
              docker logs moonraker-mcp-ci
              exit 1
            fi
            sleep 1
          done
          docker exec moonraker-mcp-ci python3 -c 'import os; pids=[p for p in os.listdir("/proc") if p.isdigit() and os.path.exists("/proc/"+p+"/cmdline") and b"gateway.py" in open("/proc/"+p+"/cmdline","rb").read().split(bytes([0]))]; assert pids and all(int(open("/proc/"+p+"/status").read().split("Uid:")[1].split()[0]) == 65534 for p in pids), pids' || {
            echo "Gateway privileges check failed"
            exit 1
          }
          echo "Gateway process is unprivileged; no printer contacted"
