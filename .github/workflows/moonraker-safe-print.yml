name: Moonraker safe print preflight
on:
  push:
    branches:
      - feat/moonraker-safe-print-workflow
  pull_request:
    paths:
      - 'moonraker_mcp/moonraker_preflight.py'
      - 'moonraker_mcp/test_moonraker_preflight.py'
      - 'moonraker_mcp/moonraker_upload.py'
      - 'moonraker_mcp/test_moonraker_upload.py'
      - 'moonraker_mcp/test_upload_policy.py'
      - 'moonraker_mcp/moonraker_staging.py'
      - 'moonraker_mcp/test_moonraker_staging.py'
      - 'moonraker_mcp/test_upload_integration.py'
      - 'moonraker_mcp/tool_policy.py'
      - 'moonraker_mcp/config.yaml'
      - 'moonraker_mcp/run.sh'
      - 'moonraker_mcp/gateway.py'
      - '.github/workflows/moonraker-safe-print.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile preflight and tests
        run: python -m py_compile moonraker_mcp/moonraker_preflight.py moonraker_mcp/test_moonraker_preflight.py moonraker_mcp/moonraker_upload.py moonraker_mcp/test_moonraker_upload.py moonraker_mcp/test_upload_policy.py moonraker_mcp/moonraker_staging.py moonraker_mcp/test_moonraker_staging.py moonraker_mcp/test_upload_integration.py
      - name: Run offline tests (no printer connection)
        working-directory: moonraker_mcp
        run: python -m unittest -v test_moonraker_preflight test_moonraker_upload test_upload_policy test_moonraker_staging test_upload_integration
