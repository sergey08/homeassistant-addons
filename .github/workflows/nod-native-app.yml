name: Verify Nod native Home Assistant app
on:
  pull_request:
    paths:
      - 'nod_native_preflight/**'
      - '.github/workflows/nod-native-app.yml'
permissions:
  contents: read
jobs:
  native-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nod-native-app:ci nod_native_preflight
      - name: Check persistent native app across container replacement
        run: |
          set -euo pipefail
          docker volume create nod-native-ci-data
          start_and_check() {
            local marker="$1"; shift
            docker run -d --name nod-native-app --network none -v nod-native-ci-data:/data "$@" nod-native-app:ci
            for attempt in {1..110}; do
              docker logs nod-native-app > probe.log 2>&1
              if grep -q '^FAIL:' probe.log; then cat probe.log; return 1; fi
              if grep -q '^PASS:' probe.log; then
                cat probe.log
                grep -q '^NOD_NATIVE_POSTGRES_OK' probe.log
                grep -q '^NOD_NATIVE_SERVER_HEALTH_OK' probe.log
                grep -q '^NOD_NATIVE_INGRESS_LISTENING' probe.log
                grep -q '^NOD_NATIVE_INGRESS_DIRECT_DENIED' probe.log
                grep -q "^$marker" probe.log
                return
              fi
              if [ "$(docker inspect -f '{{.State.Running}}' nod-native-app)" != true ]; then cat probe.log; return 1; fi
              sleep 2
            done
            cat probe.log
            return 1
          }
          start_and_check NOD_NATIVE_STORAGE_CREATED
          docker exec -i nod-native-app node --input-type=module < nod_native_preflight/check-web.mjs
          docker exec -i nod-native-app node --input-type=module < nod_native_preflight/check-ha-mcp.mjs
          docker exec nod-native-app gosu postgres psql -h 127.0.0.1 -U postgres -d postgres -c 'SELECT 1' >/dev/null 2>&1 || true
          docker exec nod-native-app sh -ec 'socket=$(find /tmp -maxdepth 1 -type d -name "nod-pg.*" | head -n 1); gosu postgres psql -h "$socket" -U postgres -v ON_ERROR_STOP=1 -d postgres -c "CREATE TABLE nod_native_ci_probe (value integer); INSERT INTO nod_native_ci_probe VALUES (42);"'
          fingerprint=$(docker exec nod-native-app sha256sum /data/nod-native-v1/secrets)
          docker stop -t 30 nod-native-app
          test "$(docker inspect -f '{{.State.ExitCode}}' nod-native-app)" = 0
          docker rm nod-native-app
          start_and_check NOD_NATIVE_STORAGE_REUSED
          test "$fingerprint" = "$(docker exec nod-native-app sha256sum /data/nod-native-v1/secrets)"
          value=$(docker exec nod-native-app sh -ec 'socket=$(find /tmp -maxdepth 1 -type d -name "nod-pg.*" | head -n 1); gosu postgres psql -h "$socket" -U postgres -d postgres -Atc "SELECT value FROM nod_native_ci_probe"')
          test "$value" = 42
          echo NOD_NATIVE_RESTART_PERSISTENCE_OK
          # Test a dedicated HTTPS origin without altering the deployed run script.
          docker stop -t 30 nod-native-app
          docker rm nod-native-app
          sed 's@NOD_PUBLIC_URL=http://localhost:4310@NOD_PUBLIC_URL=https://nod.test:8443@' nod_native_preflight/run.sh > "$RUNNER_TEMP/nod-https-run.sh"
          chmod 0755 "$RUNNER_TEMP/nod-https-run.sh"
          grep -q 'NOD_PUBLIC_URL=https://nod.test:8443' "$RUNNER_TEMP/nod-https-run.sh"
          start_and_check NOD_NATIVE_STORAGE_REUSED --mount "type=bind,source=$RUNNER_TEMP/nod-https-run.sh,target=/usr/local/bin/nod-native-preflight,readonly"
          docker cp nod_native_preflight/https-relay.mjs nod-native-app:/tmp/nod-https-relay.mjs
          docker exec -i nod-native-app node --input-type=module < nod_native_preflight/check-https.mjs
          # Exercise the actual opt-in runtime, with synthetic credentials and no host port.
          docker stop -t 30 nod-native-app
          docker rm nod-native-app
          mkdir -p "$RUNNER_TEMP/nod-cert"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=nod.test -addext subjectAltName=DNS:nod.test -keyout "$RUNNER_TEMP/nod-cert/nod-privkey.pem" -out "$RUNNER_TEMP/nod-cert/nod-fullchain.pem" >/dev/null 2>&1
          docker run --rm --network none -v nod-native-ci-data:/data --entrypoint node nod-native-app:ci -e 'require("fs").writeFileSync("/data/options.json",JSON.stringify({https_enabled:true,https_origin:"https://nod.test:8443",lan_cidr:"10.222.77.0/24",https_access_token:"x".repeat(64),ha_embed_origin:"https://ha.test:9443"}),{mode:384})'
          docker network create --internal --subnet 10.222.77.0/24 nod-native-private-ci
          docker run -d --name nod-native-app --network nod-native-private-ci --network-alias nod.test -v nod-native-ci-data:/data -v "$RUNNER_TEMP/nod-cert:/config:ro" nod-native-app:ci
          for attempt in {1..110}; do
            docker logs nod-native-app > probe.log 2>&1
            if grep -q '^FAIL:' probe.log; then cat probe.log; exit 1; fi
            if grep -q '^PASS:' probe.log; then break; fi
            sleep 2
          done
          cat probe.log
          grep -q '^NOD_NATIVE_HTTPS_RELAY_LISTENING' probe.log
          grep -q '^PASS:' probe.log
          docker run --rm --network nod-native-private-ci -v "$RUNNER_TEMP/nod-cert/nod-fullchain.pem:/tmp/ca.pem:ro" -e NODE_EXTRA_CA_CERTS=/tmp/ca.pem --entrypoint node nod-native-app:ci -e 'const assert=require("node:assert/strict"); (async()=>{const base="https://nod.test:8443"; assert.equal((await fetch(base+"/")).status,200); assert.equal((await fetch(base+"/api/session")).status,401); const r=await fetch(base+"/api/session",{headers:{authorization:"Bearer "+"x".repeat(64)}}); assert.equal(r.status,200); console.log("NOD_NATIVE_OPT_IN_HTTPS_OK")})().catch(e=>{console.error(e);process.exit(1)})'
          docker exec nod-native-app node -e 'const h=require("node:https"); const r=h.get({hostname:"127.0.0.1",port:8443,servername:"nod.test",headers:{host:"nod.test:8443"},ca:require("fs").readFileSync("/run/nod-relay/cert.pem")},res=>{res.resume();process.exit(res.statusCode===403?0:1)});r.on("error",()=>process.exit(1))'
      - name: Test isolated nested panel in real Chromium
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/nod-browser" --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          docker pull mcr.microsoft.com/playwright:v1.56.1-noble
          docker network create --internal --subnet 172.30.32.0/24 nod-ingress-ci
          docker network connect --ip 172.30.32.3 --alias nod-ingress nod-ingress-ci nod-native-app
          ip=$(docker inspect -f '{{(index .NetworkSettings.Networks "nod-native-private-ci").IPAddress}}' nod-native-app)
          docker create --name nod-native-browser --network nod-native-private-ci --shm-size=1g -e NOD_TEST_IP="$ip" -v "$RUNNER_TEMP/nod-browser:/test:ro" -v "$RUNNER_TEMP/nod-cert:/cert:ro" -v "$GITHUB_WORKSPACE/nod_native_preflight/check-embedded.mjs:/check-embedded.mjs:ro" --entrypoint node mcr.microsoft.com/playwright:v1.56.1-noble /check-embedded.mjs
          docker network connect --ip 172.30.32.2 nod-ingress-ci nod-native-browser
          docker start -a nod-native-browser
          test "$(docker inspect -f '{{.State.ExitCode}}' nod-native-browser)" = 0
      - if: always()
        run: |
          docker rm -f nod-native-browser || true
          docker rm -f nod-native-app || true
          docker volume rm nod-native-ci-data || true
          docker network rm nod-native-private-ci || true
          docker network rm nod-ingress-ci || true
