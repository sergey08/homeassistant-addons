name: Build Nod worker images
on:
  push:
    branches: [publish/nod-candidate]
concurrency:
  group: nod-worker-image-publication
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [browser, workspace]
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already published
        id: existing
        env:
          COMPONENT: ${{ matrix.component }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          directory="nod_${COMPONENT}_preflight"
          version=$(python -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["version"])' "$directory/config.yaml")
          image="ghcr.io/sergey08/nod-$COMPONENT-amd64:$version"
          # Existing public tags are immutable for this experimental distribution.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if result=$(docker manifest inspect "$image" 2>&1); then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "NOD_EXISTING_IMAGE_PRESERVED $image"
          elif printf '%s\n' "$result" | grep -Eiq 'manifest unknown|no such manifest|: not found'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$result" >&2
            exit 1
          fi
      - name: Build and verify worker image
        if: steps.existing.outputs.published == 'false'
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          directory="nod_${COMPONENT}_preflight"
          version=$(python -c 'import sys,yaml; print(yaml.safe_load(open(sys.argv[1]))["version"])' "$directory/config.yaml")
          image="ghcr.io/sergey08/nod-$COMPONENT-amd64:$version"
          docker build --label org.opencontainers.image.source=https://github.com/sergey08/homeassistant-addons --tag "$image" "$directory"
          if [ "$COMPONENT" = browser ]; then
            docker run --rm --network none --entrypoint sh "$image" -ec 'test -s /app/worker.mjs && test -x /app/ha-browser-run.sh && chromium --version'
          else
            docker run --rm --network none --entrypoint sh "$image" -ec 'test -x /usr/local/bin/nod-ha-workspace-preflight && python3 --version && libreoffice --version'
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Publish image
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
