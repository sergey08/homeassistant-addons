name: Verify Nod offline workspace preflight
on:
  pull_request:
    paths:
      - 'nod_workspace_preflight/**'
      - 'nod_native_preflight/**'
      - '.github/workflows/nod-workspace-preflight.yml'
permissions:
  contents: read
jobs:
  offline-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build upstream-derived workspace
        run: docker build -t nod-workspace:ci nod_workspace_preflight
      - name: Check isolation and synthetic artifact creation
        run: |
          set -euo pipefail
          docker network create --internal --subnet 10.223.81.0/24 nod-workspace-ci
          docker run -d --name nod-workspace-fixture --network nod-workspace-ci --ip 10.223.81.34 --entrypoint node nod-workspace:ci -e 'require("node:http").createServer((q,r)=>{console.log("PRIVATE_REQUEST");r.end("fixture")}).listen(80,"0.0.0.0")'
          docker volume create nod-workspace-ci-data
          docker run -d --name nod-workspace-test --network nod-workspace-ci --cap-drop ALL --cap-add NET_ADMIN --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add SETPCAP --cap-add FOWNER --cap-add KILL --security-opt no-new-privileges --pids-limit 128 --memory 2g -v nod-workspace-ci-data:/data nod-workspace:ci
          for i in {1..45}; do
            if docker logs nod-workspace-test 2>&1 | grep NOD_WORKSPACE_UNPRIVILEGED_READY >/dev/null; then break; fi
            sleep 2
          done
          docker logs nod-workspace-test 2>&1 | grep NOD_WORKSPACE_SYNTHETIC_ARTIFACTS_OK
          docker logs nod-workspace-test 2>&1 | grep NOD_WORKSPACE_UNPRIVILEGED_READY
          docker exec --user 1000:1000 nod-workspace-test sh -ec 'test ! -r /data/options.json; test ! -e /var/run/docker.sock; ! curl -fsS --connect-timeout 2 --max-time 3 http://10.223.81.34'
          if docker logs nod-workspace-fixture 2>&1 | grep PRIVATE_REQUEST >/dev/null; then exit 1; fi
          docker exec --user 1000:1000 nod-workspace-test sh -ec 'umask 077; printf synthetic > /workspace/ci-persistence'
          docker restart nod-workspace-test
          for i in {1..45}; do
            if [ "$(docker logs nod-workspace-test 2>&1 | grep -c NOD_WORKSPACE_UNPRIVILEGED_READY)" -ge 2 ]; then break; fi
            sleep 2
          done
          test "$(docker logs nod-workspace-test 2>&1 | grep -c NOD_WORKSPACE_UNPRIVILEGED_READY)" -ge 2
          docker exec --user 1000:1000 nod-workspace-test sh -ec 'test "$(cat /workspace/ci-persistence)" = synthetic'
          echo NOD_WORKSPACE_PERSISTENCE_OK
      - name: Test optional authenticated probe in actual workspace container
        run: |
          set -euo pipefail
          docker run -d --name nod-workspace-peer --network nod-workspace-ci --network-alias ci-nod-native-preflight --entrypoint sleep nod-workspace:ci infinity
          docker volume create nod-workspace-probe-data
          docker run --rm --network none -v nod-workspace-probe-data:/data --entrypoint node nod-workspace:ci -e 'require("node:fs").writeFileSync("/data/options.json",JSON.stringify({remote_enabled:true,remote_key:"a".repeat(64),server_host:"ci-nod-native-preflight"}),{mode:384})'
          docker run -d --name nod-workspace-probe --network nod-workspace-ci --network-alias nod-workspace-ci-worker --cap-drop ALL --cap-add NET_ADMIN --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add SETPCAP --cap-add FOWNER --cap-add KILL --security-opt no-new-privileges --pids-limit 128 --memory 2g -v nod-workspace-probe-data:/data nod-workspace:ci
          for i in {1..30}; do
            if docker logs nod-workspace-probe 2>&1 | grep NOD_WORKSPACE_TRANSPORT_READY >/dev/null; then break; fi
            sleep 2
          done
          docker logs nod-workspace-probe 2>&1 | grep NOD_WORKSPACE_TRANSPORT_READY
          docker cp nod_workspace_preflight/test-transport.mjs nod-workspace-peer:/tmp/test-transport.mjs
          docker exec --user 1000:1000 nod-workspace-peer node /tmp/test-transport.mjs
          docker exec --user 1000:1000 nod-workspace-probe sh -ec 'test ! -r /run/nod-workspace-gateway/settings.json; test ! -r /data/options.json; ! curl -fsS --connect-timeout 2 --max-time 3 http://10.223.81.34'
          docker exec nod-workspace-fixture node -e 'const s=require("node:net").connect(9593,"nod-workspace-ci-worker");s.setTimeout(2000);s.on("connect",()=>process.exit(1));s.on("error",()=>process.exit(0));s.on("timeout",()=>{s.destroy();process.exit(0)})'
          if docker logs nod-workspace-fixture 2>&1 | grep PRIVATE_REQUEST >/dev/null; then exit 1; fi
          echo NOD_WORKSPACE_PEER_AND_KEY_ISOLATION_OK
      - name: Verify fixed diagnostic from the actual Nod Server package
        run: |
          set -euo pipefail
          docker rm -f nod-workspace-peer nod-workspace-probe
          docker build -t nod-workspace-server:ci nod_native_preflight
          docker volume create nod-workspace-server-data
          docker run --rm --network none -v nod-workspace-server-data:/data --entrypoint node nod-workspace-server:ci -e 'require("node:fs").writeFileSync("/data/options.json",JSON.stringify({workspace_probe_enabled:true,workspace_command_probe_enabled:true,workspace_key:"a".repeat(64),workspace_host:"ci-nod-workspace-preflight",browser_key:"b".repeat(64),https_enabled:false}),{mode:384})'
          docker run --rm --network none -v nod-workspace-probe-data:/data --entrypoint node nod-workspace:ci -e 'require("node:fs").writeFileSync("/data/options.json",JSON.stringify({remote_enabled:true,remote_key:"a".repeat(64),server_host:"ci-nod-native-preflight",command_enabled:true}),{mode:384})'
          docker run -d --name nod-workspace-server --network nod-workspace-ci --network-alias ci-nod-native-preflight -v nod-workspace-server-data:/data nod-workspace-server:ci
          docker run -d --name nod-workspace-probe --network nod-workspace-ci --network-alias ci-nod-workspace-preflight --cap-drop ALL --cap-add NET_ADMIN --cap-add CHOWN --cap-add SETUID --cap-add SETGID --cap-add DAC_OVERRIDE --cap-add SETPCAP --cap-add FOWNER --cap-add KILL --security-opt no-new-privileges --pids-limit 128 --memory 2g -v nod-workspace-probe-data:/data nod-workspace:ci
          for i in {1..100}; do
            if docker logs nod-workspace-server 2>&1 | grep NOD_WORKSPACE_PROTOCOL_RECOVERY_OK >/dev/null; then break; fi
            sleep 2
          done
          docker logs nod-workspace-server 2>&1 | grep NOD_NATIVE_SERVER_HEALTH_OK
          docker logs nod-workspace-server 2>&1 | grep NOD_WORKSPACE_DIAGNOSTIC_EXEC_OK
          docker logs nod-workspace-server 2>&1 | grep NOD_WORKSPACE_DIAGNOSTIC_CANCEL_OK
          docker logs nod-workspace-server 2>&1 | grep NOD_WORKSPACE_DIAGNOSTIC_ARBITRARY_REJECTED
          docker logs nod-workspace-server 2>&1 | grep NOD_WORKSPACE_DIAGNOSTIC_RECOVERY_OK
          if docker logs nod-workspace-server 2>&1 | grep NOD_WORKSPACE_DIAGNOSTIC_FAILED >/dev/null; then exit 1; fi
          docker exec nod-workspace-server gosu nodrelay test ! -r /run/nod-workspace-client/settings.json
          for marker in FRAMES_OK STREAMING_OK CANCEL_CONFIRMED LIMITS_OK FILES_OK DISCONNECT_RECOVERED SYMLINK_REJECTED RECOVERY_OK; do
            docker logs nod-workspace-server 2>&1 | grep "NOD_WORKSPACE_PROTOCOL_$marker"
          done
          echo NOD_WORKSPACE_PACKAGED_SERVER_OK
      - name: Logs and cleanup
        if: always()
        run: |
          docker logs nod-workspace-test 2>&1 || true
          docker logs nod-workspace-probe 2>&1 || true
          docker logs nod-workspace-server 2>&1 || true
          docker rm -f nod-workspace-server nod-workspace-test nod-workspace-fixture nod-workspace-probe nod-workspace-peer || true
          docker volume rm nod-workspace-ci-data nod-workspace-probe-data nod-workspace-server-data || true
          docker network rm nod-workspace-ci || true
