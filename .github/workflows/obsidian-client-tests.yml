name: Tests / Pruebas
on:
  workflow_dispatch:
  push:
    paths:
      - 'obsidian_client/**'
      - '.github/workflows/obsidian-client-tests.yml'
  pull_request:
    paths:
      - 'obsidian_client/**'
      - '.github/workflows/obsidian-client-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    name: Python tests / Pruebas Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies / Instalar dependencias
        run: pip install flask==3.1.1 Markdown==3.8.2 cryptography==46.0.3
      - name: Check Python syntax / Comprobar sintaxis Python
        run: python -m compileall -q obsidian_client
      - name: Run tests / Ejecutar pruebas
        working-directory: obsidian_client
        run: python -m unittest discover -v -p 'test_*.py'

  official-livesync-cli:
    name: Official LiveSync CLI / Cliente oficial
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned upstream source / Obtener versión fijada
        uses: actions/checkout@v4
        with:
          repository: vrtmrz/obsidian-livesync
          ref: e4d47f4f1d73d7c5b0635ff7068ff7da994eb731
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact upstream dependencies / Instalar dependencias
        working-directory: upstream
        run: npm ci
      - name: Build official CLI / Compilar cliente oficial
        working-directory: upstream
        run: npm run build -w self-hosted-livesync-cli
      - name: Verify CLI bundle / Verificar ejecutable
        working-directory: upstream
        run: |
          test -s src/apps/cli/dist/index.cjs
          node src/apps/cli/dist/index.cjs --help

      - name: Exercise isolated local note write and read / Probar nota local
        working-directory: upstream
        run: |
          set -euo pipefail
          DB="$(mktemp -d)"
          CLI="src/apps/cli/dist/index.cjs"
          mkdir -p "$DB/.livesync"
          node "$CLI" init-settings "$DB/.livesync/settings.json"
          printf '# Isolated test\nHello LiveSync\n' | node "$CLI" "$DB" put "Tests/isolated.md"
          node "$CLI" "$DB" cat "Tests/isolated.md" > /tmp/livesync-note.md
          printf '# Isolated test\nHello LiveSync\n' | cmp - /tmp/livesync-note.md
          node "$CLI" "$DB" ls > /tmp/livesync-ls.txt
          grep -F 'Tests/isolated.md' /tmp/livesync-ls.txt
          cat /tmp/livesync-ls.txt

  addon-image:
    name: Add-on image / Imagen de la aplicación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build add-on container / Construir contenedor
        run: docker build -t obsidian-client-ci obsidian_client
      - name: Verify patched fetch diagnostics in bundled CLI
        run: |
          docker run --rm --entrypoint sh obsidian-client-ci -c '
            set -eu
            test -s /opt/livesync-cli/dist/index.cjs
            grep -q "HA_FETCH_FAILURE" /opt/livesync-cli/dist/index.cjs
            grep -q "origin=" /opt/livesync-cli/dist/index.cjs
            grep -q "topFrame" /opt/livesync-cli/dist/index.cjs
            /usr/local/bin/node /opt/livesync-cli/dist/index.cjs --help >/dev/null
          '
      - name: Verify packaged imports / Verificar módulos empaquetados
        run: |
          docker run --rm --entrypoint python obsidian-client-ci -c \
            "import server, livesync_metadata, livesync_write_preflight, couchdb_cas, livesync_cli_bridge; print('imports ok')"

  couchdb-integration:
    name: Isolated CouchDB / CouchDB aislado
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3.4
        env:
          COUCHDB_USER: testadmin
          COUCHDB_PASSWORD: test-only-not-production
        ports:
          - 5984:5984
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install integration dependencies / Instalar dependencias de integración
        run: pip install flask==3.1.1 Markdown==3.8.2 cryptography==46.0.3
      - name: Wait for test server / Esperar al servidor de pruebas
        run: |
          python - <<'PY'
          import time, urllib.request
          for attempt in range(40):
              try:
                  urllib.request.urlopen('http://127.0.0.1:5984/_up', timeout=2)
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise RuntimeError('Test CouchDB did not start')
          PY
      - name: Initialize single-node CouchDB / Inicializar CouchDB independiente
        run: |
          python - <<'PY'
          import base64, json, urllib.request
          root = 'http://127.0.0.1:5984'
          token = base64.b64encode(b'testadmin:test-only-not-production').decode()
          headers = {'Authorization': 'Basic ' + token, 'Content-Type': 'application/json'}
          req = urllib.request.Request(root + '/_cluster_setup', headers=headers)
          with urllib.request.urlopen(req, timeout=8) as response:
              state = json.load(response)['state']
          if state != 'single_node_enabled':
              payload = json.dumps({
                  'action': 'enable_single_node', 'bind_address': '0.0.0.0',
                  'username': 'testadmin', 'password': 'test-only-not-production',
                  'port': 5984
              }).encode()
              req = urllib.request.Request(root + '/_cluster_setup', data=payload,
                                           headers=headers, method='POST')
              with urllib.request.urlopen(req, timeout=15) as response:
                  print('Setup HTTP:', response.status)
          PY
      - name: Fetch official CLI for isolated encrypted sync
        uses: actions/checkout@v4
        with:
          repository: vrtmrz/obsidian-livesync
          ref: e4d47f4f1d73d7c5b0635ff7068ff7da994eb731
          path: livesync-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build official CLI for CouchDB integration
        working-directory: livesync-upstream
        run: |
          npm ci
          npm run build -w self-hosted-livesync-cli
      - name: Build production add-on image for integration
        run: docker build -t obsidian-client-integration obsidian_client
      - name: Use exact packaged CLI bundle for encrypted integration
        run: |
          set -euo pipefail
          container=$(docker create obsidian-client-integration)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/opt/livesync-cli/dist/index.cjs" livesync-upstream/src/apps/cli/dist/index.cjs
          mkdir -p /tmp/obsidian-cli-bin
          docker cp "$container:/usr/local/bin/node" /tmp/obsidian-cli-bin/node
          chmod +x /tmp/obsidian-cli-bin/node
          echo "/tmp/obsidian-cli-bin" >> "$GITHUB_PATH"
          /tmp/obsidian-cli-bin/node --version
          grep -q 'HA_FETCH_FAILURE' livesync-upstream/src/apps/cli/dist/index.cjs
      - name: Encrypted CLI replication against disposable CouchDB
        env:
          TEST_COUCHDB_USER: testadmin
          TEST_COUCHDB_PASSWORD: test-only-not-production
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, tempfile, urllib.request, uuid, subprocess
          from sys import path as syspath
          syspath.insert(0, "obsidian_client")
          from livesync_cli_bridge import install_official_cli_settings
          from urllib.parse import quote
          def register_remote(cli, database, config):
              settings_file=pathlib.Path(database)/".livesync"/"settings.json"
              # Mirror fetch_remote_to_disposable_database: merge official
              # CLI defaults before registering the remote connection.
              with tempfile.TemporaryDirectory() as defaults_dir:
                  defaults_path=pathlib.Path(defaults_dir)/"defaults.json"
                  subprocess.run(["node",cli,"init-settings",str(defaults_path)],
                                 capture_output=True,text=True,check=True,timeout=45)
                  defaults=json.loads(defaults_path.read_text(encoding="utf-8"))
                  overrides=json.loads(settings_file.read_text(encoding="utf-8"))
                  assert isinstance(defaults,dict) and isinstance(overrides,dict)
                  settings={**defaults,**overrides}
                  settings_file.write_text(json.dumps(settings),encoding="utf-8")
              remote_id=settings["activeConfigurationId"]
              conn=settings["remoteConfigurations"][remote_id]["uri"]
              settings["remoteConfigurations"]={}
              settings["activeConfigurationId"]=""
              settings_file.write_text(json.dumps(settings))
              result=subprocess.run(["node",cli,database,"remote-add","CI CouchDB",conn],
                                    capture_output=True,text=True,check=True,timeout=45)
              import re
              ids=re.findall(r"(?m)^([A-Za-z0-9_-]{8,128})\tCI CouchDB\t",result.stdout)
              assert len(ids)==1, "Remote registration did not return one valid profile"
              remote_id=ids[0]
              subprocess.run(["node",cli,database,"remote-activate",remote_id],
                             capture_output=True,text=True,check=True,timeout=45)
              return remote_id
          root="http://127.0.0.1:5984"
          name="obsidian_encrypted_ci_"+uuid.uuid4().hex
          auth="Basic "+base64.b64encode((os.environ["TEST_COUCHDB_USER"]+":"+os.environ["TEST_COUCHDB_PASSWORD"]).encode()).decode()
          url=root+"/"+name
          def call(method):
              req=urllib.request.Request(url, method=method, headers={"Authorization":auth})
              with urllib.request.urlopen(req,timeout=10) as response:
                  return response.status
          assert call("PUT") == 201
          cli="livesync-upstream/src/apps/cli/dist/index.cjs"
          try:
              with tempfile.TemporaryDirectory() as temp:
                  config={"couchdb_url":root,"couchdb_database":name,
                          "couchdb_username":os.environ["TEST_COUCHDB_USER"],
                          "couchdb_password":os.environ["TEST_COUCHDB_PASSWORD"],
                          "livesync_encryption_enabled":True,
                          "livesync_e2ee_passphrase":"isolated-ci-encryption-only"}
                  install_official_cli_settings(config,temp)
                  register_remote(cli,temp,config)
                  note="Tests/encrypted-roundtrip.md"
                  content="# Encrypted isolated test\nNever production\n"
                  subprocess.run(["node",cli,temp,"put",note],input=content,text=True,check=True,timeout=45)
                  subprocess.run(["node",cli,temp,"sync"],check=True,timeout=90)
                  with tempfile.TemporaryDirectory() as second:
                      install_official_cli_settings(config,second)
                      register_remote(cli,second,config)
                      subprocess.run(["node",cli,second,"sync"],check=True,timeout=90)
                      result=subprocess.run(["node",cli,second,"cat",note],capture_output=True,text=True,timeout=45)
                      assert result.returncode==0, "Second client could not read encrypted note"
                      assert result.stdout==content, "Encrypted note roundtrip content mismatch"
                  # The production client uses fetch, not just sync. Exercise
                  # that exact command against a fresh disposable database.
                  with tempfile.TemporaryDirectory() as third:
                      vault=pathlib.Path(third)/"vault"
                      vault.mkdir()
                      db=pathlib.Path(third)/"db"
                      db.mkdir()
                      install_official_cli_settings(config,str(db))
                      register_remote(cli,str(db),config)
                      fetch_result=subprocess.run(
                          ["node",cli,str(db),"--vault",str(vault),"fetch","--force"],
                          capture_output=True,text=True,timeout=90)
                      if fetch_result.returncode:
                          import re
                          diagnostic=re.search(
                              r"\[HA_FETCH_FAILURE\] type=([A-Za-z0-9_-]{1,40}) "
                              r"code=([A-Za-z0-9_-]{1,40}) "
                              r"detail=([A-Za-z0-9_-]{1,40}) "
                              r"cause=([A-Za-z0-9_-]{1,40}) "
                              r"origin=([A-Za-z0-9_-]{1,40})",
                              fetch_result.stderr)
                          safe_category=diagnostic.groups() if diagnostic else ("unclassified",)
                          print("Isolated fetch failure category:", safe_category)
                          # Independent control on the same disposable CouchDB:
                          # does normal replication recover the encrypted note?
                          # This tests whether the failure is specific to fetch.
                          with tempfile.TemporaryDirectory() as control:
                              install_official_cli_settings(config,control)
                              register_remote(cli,control,config)
                              control_sync=subprocess.run(
                                  ["node",cli,control,"sync"],
                                  capture_output=True,text=True,timeout=90)
                              control_cat=subprocess.run(
                                  ["node",cli,control,"cat",note],
                                  capture_output=True,text=True,timeout=45) if control_sync.returncode==0 else None
                              sync_control_ok=bool(
                                  control_cat and control_cat.returncode==0
                                  and control_cat.stdout==content)
                          print("Isolated encrypted sync control:", "PASS" if sync_control_ok else "FAIL")
                          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                              summary.write("### Encrypted LiveSync fetch / Recuperación cifrada\n")
                              summary.write("Result / Resultado: **FAILED**\n\n")
                              summary.write("Independent sync control / Control de sincronización: **" + ("PASS" if sync_control_ok else "FAIL") + "**\n\n")
                              summary.write("Safe diagnostic / Diagnóstico seguro: `" + " / ".join(safe_category) + "`\n")
                          raise AssertionError("Packaged CLI failed encrypted isolated fetch")
                      result=subprocess.run(["node",cli,str(db),"cat",note],
                                            capture_output=True,text=True,timeout=45)
                      restored=vault/note
                      assert (result.returncode==0 and result.stdout==content) or (restored.is_file() and restored.read_text()==content), "Fetch did not restore expected Markdown note"
                  # Compare only sanitized document-ID shapes from the official
                  # client; never display IDs, paths, contents, or credentials.
                  index_request=urllib.request.Request(
                      url+"/_all_docs?include_docs=true&limit=500",
                      headers={"Authorization":auth})
                  with urllib.request.urlopen(index_request,timeout=10) as response:
                      official_rows=json.load(response).get("rows",[])
                  def classify_doc(doc):
                      kind=doc.get("type")
                      if kind not in ("plain","newnote","leaf","chunk"):
                          return None
                      identifier=doc.get("_id","")
                      if not isinstance(identifier,str):
                          return None
                      return (kind,
                              "hex" if len(identifier)>=32 and all(c in "0123456789abcdef" for c in identifier.lower()) else
                              "prefixed" if ":" in identifier else "other",
                              "short" if len(identifier)<33 else "medium" if len(identifier)<81 else "long")
                  shapes={}
                  for row in official_rows:
                      doc=row.get("doc",{})
                      if isinstance(doc,dict):
                          shape=classify_doc(doc)
                          if shape is not None:
                              label="/".join(shape)
                              shapes[label]=shapes.get(label,0)+1
                  print("Official CLI document shape counts:",sorted(shapes.items()))
                  # Compare public schema field names only (no values).
                  field_sets={}
                  for row in official_rows:
                      doc=row.get("doc",{})
                      if isinstance(doc,dict) and doc.get("type") in ("plain","newnote","leaf"):
                          kind=doc["type"]
                          names=tuple(sorted(k for k in doc if k not in
                              ("_id","_rev","data","path","children")))
                          field_sets.setdefault(kind,{})
                          field_sets[kind][names]=field_sets[kind].get(names,0)+1
                  print("Official CLI extra metadata field names:",
                        sorted((kind,list(names),count) for kind,groups in field_sets.items()
                               for names,count in groups.items()))
                  # Only compare the data types and envelope prefixes; never
                  # print real field values, IDs, paths or decrypted contents.
                  def safe_type(value):
                      if value is None: return "null"
                      if isinstance(value,bool): return "bool"
                      if isinstance(value,int): return "int"
                      if isinstance(value,str): return "str"
                      if isinstance(value,list): return "list"
                      if isinstance(value,dict): return "object"
                      return "other"
                  observed_types={}
                  for row in official_rows:
                      doc=row.get("doc",{})
                      if not isinstance(doc,dict) or doc.get("type") not in ("plain","newnote","leaf"):
                          continue
                      for key in ("e_","eden","ctime","mtime","size","children","path","data"):
                          if key in doc:
                              marker=(doc["type"],key,safe_type(doc[key]))
                              observed_types[marker]=observed_types.get(marker,0)+1
                  print("Official CLI typed field counts:",sorted(observed_types.items()))
                  # Pin the *observed* structural contract from the upstream
                  # CLI. No assumptions are made about private field values.
                  expected_types={
                      ("leaf","data","str"),
                      ("leaf","e_","bool"),
                      ("plain","children","list"),
                      ("plain","ctime","int"),
                      ("plain","eden","object"),
                      ("plain","mtime","int"),
                      ("plain","path","str"),
                      ("plain","size","int"),
                  }
                  assert expected_types.issubset(set(observed_types)), (
                      "Official LiveSync document schema changed; review the "
                      "encrypted-write implementation before enabling writes")

                  # Describe nested metadata schema without exposing values.
                  eden_shapes={}
                  for row in official_rows:
                      doc=row.get("doc",{})
                      if not isinstance(doc,dict) or doc.get("type")!="plain":
                          continue
                      eden=doc.get("eden")
                      if not isinstance(eden,dict):
                          continue
                      shape=tuple(sorted((key,safe_type(val)) for key,val in eden.items()))
                      eden_shapes[shape]=eden_shapes.get(shape,0)+1
                  print("Official CLI eden field type shapes:",
                        sorted((list(shape),count) for shape,count in eden_shapes.items()))
                  # Strict interoperability probe: our encrypted parent and leaf
                  # must be readable by an independent official CLI client.
                  # This deliberately fails if our synthetic document IDs or
                  # metadata are not interoperable; do not loosen the assertion.
                  from livesync_crypto import encrypt_hkdf_string
                  import urllib.error
                  salt_request=urllib.request.Request(
                      url+"/_local/obsidian_livesync_sync_parameters",
                      headers={"Authorization":auth})
                  with urllib.request.urlopen(salt_request,timeout=10) as response:
                      remote_salt=json.load(response)["pbkdf2salt"]
                  # Isolate encryption compatibility from metadata and ID derivation:
                  # preserve official IDs, parent metadata, revision, and leaf
                  # flags; replace only ciphertext in this disposable database.
                  official_leaves=[row["doc"] for row in official_rows
                                   if isinstance(row.get("doc"),dict)
                                   and row["doc"].get("type")=="leaf"]
                  assert len(official_leaves)==1, "Expected one official test leaf"
                  encrypted_leaf=official_leaves[0].copy()
                  replacement=content.replace("Never production","Offline isolated")
                  assert replacement!=content
                  assert len(replacement.encode("utf-8"))==len(content.encode("utf-8"))
                  encrypted_leaf["data"]=encrypt_hkdf_string(
                      replacement,config["livesync_e2ee_passphrase"],remote_salt)
                  put_request=urllib.request.Request(
                      url+"/"+quote(encrypted_leaf["_id"],safe=""),
                      method="PUT",data=json.dumps(encrypted_leaf).encode("utf-8"),
                      headers={"Authorization":auth,"Content-Type":"application/json"})
                  with urllib.request.urlopen(put_request,timeout=10) as response:
                      assert response.status==201
                  with tempfile.TemporaryDirectory() as replacement_reader:
                      install_official_cli_settings(config,replacement_reader)
                      register_remote(cli,replacement_reader,config)
                      synced=subprocess.run(
                          ["node",cli,replacement_reader,"sync"],
                          capture_output=True,text=True,timeout=90)
                      assert synced.returncode==0, "CLI sync failed with Python ciphertext"
                      decoded=subprocess.run(
                          ["node",cli,replacement_reader,"cat",note],
                          capture_output=True,text=True,timeout=45)
                      assert decoded.returncode==0 and decoded.stdout==replacement, (
                          "Official CLI could not read Python-encrypted leaf with official IDs")
                  print("Official CLI decoded Python-encrypted leaf with original IDs")

                  # Independently rewrite the *parent* metadata through CouchDB
                  # using the official document shape and optimistic _rev.
                  official_parents=[row["doc"] for row in official_rows
                                    if isinstance(row.get("doc"),dict)
                                    and row["doc"].get("type")=="plain"]
                  assert len(official_parents)==1, "Expected one official parent"
                  parent=official_parents[0].copy()
                  assert isinstance(parent.get("eden"),dict)
                  assert isinstance(parent.get("ctime"),int)
                  assert isinstance(parent.get("mtime"),int)
                  assert isinstance(parent.get("children"),list)
                  parent["mtime"]+=1
                  parent_request=urllib.request.Request(
                      url+"/"+quote(parent["_id"],safe=""),
                      method="PUT",data=json.dumps(parent).encode("utf-8"),
                      headers={"Authorization":auth,"Content-Type":"application/json"})
                  with urllib.request.urlopen(parent_request,timeout=10) as response:
                      assert response.status==201, "Python parent metadata update failed"
                  with tempfile.TemporaryDirectory() as parent_reader:
                      install_official_cli_settings(config,parent_reader)
                      register_remote(cli,parent_reader,config)
                      synced=subprocess.run(["node",cli,parent_reader,"sync"],
                                          capture_output=True,text=True,timeout=90)
                      assert synced.returncode==0, "CLI sync failed after Python parent update"
                      recovered=subprocess.run(["node",cli,parent_reader,"cat",note],
                                            capture_output=True,text=True,timeout=45)
                      assert recovered.returncode==0 and recovered.stdout==replacement, (
                          "Official CLI cannot recover note after Python metadata rewrite")
                  print("Official CLI decoded Python-updated parent and encrypted leaf")

                  # Determine an actual path-to-ID relationship from a
                  # fresh official CLI fixture. Do not print identifiers.
                  official_parent=official_parents[0]
                  official_id=official_parent["_id"]
                  official_path=note
                  identity_probes={
                      "literal-path":official_id==official_path,
                      "literal-prefixed":official_id==("f:"+official_path),
                      "lowercase-path":official_id==official_path.lower(),
                      "lowercase-prefixed":official_id==("f:"+official_path.lower()),
                  }
                  print("Official CLI path identity probes:",sorted(identity_probes.items()))
                  assert identity_probes["lowercase-path"], "Official CLI path ID convention changed"
                  assert isinstance(official_id,str) and bool(official_id)
                  test_path="Tests/generated-by-ha.md"
                  test_content="# Generated by HA\\nInteroperability check\\n"
                  leaf_id="ha-synthetic-leaf-"+uuid.uuid4().hex
                  parent_id=test_path.lower()
                  metadata={"path":test_path,"children":[leaf_id],
                            "size":len(test_content.encode("utf-8"))}
                  generated_docs=[
                      {"_id":leaf_id,"type":"leaf","e_":True,
                       "data":encrypt_hkdf_string(test_content,
                           config["livesync_e2ee_passphrase"],remote_salt)},
                      {"_id":parent_id,"type":"plain",
                       "path":"/\\\\:%="+encrypt_hkdf_string(
                           json.dumps(metadata),config["livesync_e2ee_passphrase"],
                           remote_salt)[2:],
                       "children":[leaf_id],"size":metadata["size"],
                       "ctime":1730000000000,"mtime":1730000000000,"eden":{}},
                  ]
                  print("HA generated extra metadata field names:",
                        sorted((doc["type"],sorted(k for k in doc if k not in
                               ("_id","_rev","data","path","children")))
                               for doc in generated_docs))

                  for generated in generated_docs:
                      request=urllib.request.Request(
                          url+"/"+quote(generated["_id"],safe=""),
                          method="PUT",
                          data=json.dumps(generated).encode("utf-8"),
                          headers={"Authorization":auth,"Content-Type":"application/json"})
                      with urllib.request.urlopen(request,timeout=10) as response:
                          assert response.status==201
                  with tempfile.TemporaryDirectory() as reader:
                      install_official_cli_settings(config,reader)
                      register_remote(cli,reader,config)
                      sync=subprocess.run(["node",cli,reader,"sync"],
                                          capture_output=True,text=True,timeout=90)
                      assert sync.returncode==0, "Official CLI sync failed reading HA documents"
                      cat=subprocess.run(["node",cli,reader,"cat",test_path],
                                         capture_output=True,text=True,timeout=45)
                      assert cat.returncode==0 and cat.stdout==test_content, (
                          "Official LiveSync CLI cannot decode HA-generated document; "
                          "metadata or document-ID derivation still incompatible")
                  print("Independent CLI decoded HA-generated encrypted note")
                  print("Encrypted sync and fetch roundtrip verified in disposable database")
          finally:
              assert call("DELETE")==200
          PY
      - name: Run isolated integration test / Ejecutar integración aislada
        working-directory: obsidian_client
        env:
          TEST_COUCHDB_URL: http://127.0.0.1:5984
          TEST_COUCHDB_USER: testadmin
          TEST_COUCHDB_PASSWORD: test-only-not-production
        run: python -m unittest -v test_real_couchdb
