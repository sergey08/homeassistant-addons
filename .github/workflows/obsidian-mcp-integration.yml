name: Obsidian MCP integration
on:
  pull_request:
    paths:
      - 'custom_components/obsidian_mcp/**'
      - 'tests/obsidian_mcp_integration_smoke.py'
      - 'hacs.json'
      - '.github/workflows/obsidian-mcp-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.9.4"
            mcp: "1.26.0"
          - homeassistant: "2026.11.0"
            mcp: "2.3.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: >-
          python -m pip install
          'homeassistant==${{ matrix.homeassistant }}'
          'mcp==${{ matrix.mcp }}'
          'uvicorn==0.54.0'
      - run: python tests/obsidian_mcp_integration_smoke.py
  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
