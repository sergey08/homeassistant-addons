configuration:
  moonraker_url:
    name: "Moonraker API address"
    description: >-
      Full URL of your printer's Moonraker API, normally http://printer.local:7125
      or http://PRINTER_IP:7125. This is not necessarily the Fluidd web address.
  moonraker_api_key:
    name: "Moonraker API key (if needed)"
    description: >-
      Existing Moonraker API key, only if the printer requires it. An authorized
      client can retrieve it using GET /access/api_key; do not regenerate it.
      This key is different from the MCP token and the OpenAI API key.
  mcp_http_token:
    name: "MCP security token (required)"
    description: >-
      Create a unique random secret of at least 32 characters for this MCP server.
      Required to start. Never reuse or share a Moonraker or OpenAI key.
  enable_tunnel:
    name: "Enable private ChatGPT tunnel"
    description: >-
      Start the optional outbound OpenAI Secure MCP Tunnel for ChatGPT.
      Requires your own tunnel ID and restricted OpenAI Platform API key.
      No router port forwarding is needed. Keep off for local-only use.
  tunnel_id:
    name: "OpenAI tunnel ID"
    description: >-
      Tunnel identifier created in OpenAI Platform (usually starts with tunnel_).
      This is not an API key. Do not run DEV and stable simultaneously with
      the same tunnel ID.
  openai_tunnel_api_key:
    name: "Restricted OpenAI tunnel API key"
    description: >-
      Restricted OpenAI Platform API key with Tunnels Read and Use permissions
      for this tunnel. Enter only here; never paste it into logs or issues.
  enable_jobqueue:
    name: "Extra access: print job queue"
    description: >-
      Allow the read-only moonraker_jobqueue_status tool to inspect queued
      print jobs and queue status when supported by Moonraker. Does not start,
      cancel or reorder jobs. May reveal print activity.
  enable_files:
    name: "Extra access: G-code files"
    description: >-
      Allow read-only file list, metadata and up-to-16-KiB G-code preview tools.
      Can reveal filenames and print parameters. Cannot upload, delete or
      modify files. Enable only if you want ChatGPT to inspect G-code files.
  enable_objects:
    name: "Extra access: Klipper objects"
    description: >-
      Allow read-only listing and querying of Klipper objects and their
      current state. Can expose detailed printer status and configuration
      information. Does not set objects or execute commands.
  enable_history:
    name: "Extra access: print history"
    description: >-
      Allow read-only print history, individual job details and aggregate
      statistics when supported by Moonraker. Can reveal filenames, dates,
      durations and previous printing activity.
  enable_sensors:
    name: "Extra access: sensors"
    description: >-
      Allow read-only sensor list, information and measurements beyond the
      default limited temperature history. Available values depend on the
      printer and installed Moonraker components.
  enable_spoolman:
    name: "Extra access: Spoolman filament"
    description: >-
      Allow read-only Spoolman status, individual spool lookup and full inventory
      summary (up to 100 spools), when Moonraker's [spoolman] integration is
      configured. Shows material, brand, color and remaining grams.
      Does not update spool inventory or filament consumption.
  enable_power:
    name: "Extra access: power status"
    description: >-
      Allow the read-only moonraker_power_status tool to check configured
      Moonraker power-device status. Does NOT turn power outlets or the
      printer on/off; do not confuse this with power control.
