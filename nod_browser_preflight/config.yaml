name: "Nod Browser (experimental)"
version: "0.1.0-dev.4"
slug: "nod_browser_preflight"
description: "Isolated upstream Nod browser worker with optional authenticated internal transport"
url: "https://github.com/sergey08/homeassistant-addons/pull/139"
arch:
  - amd64
startup: application
boot: manual
init: false
stage: experimental
host_network: false
host_pid: false
host_ipc: false
docker_api: false
hassio_api: false
homeassistant_api: false
ingress: false
privileged:
  - NET_ADMIN
options:
  remote_enabled: false
  remote_key: ""
  server_host: ""
schema:
  remote_enabled: bool
  remote_key: password
  server_host: str
