name: Obsidian Client (Development)
slug: obsidian_client
version: "0.1.0-dev43"
description: "Independent Obsidian client / Cliente Obsidian independiente (experimental)"
url: https://github.com/sergey08/homeassistant-addons/tree/main/obsidian_client
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:notebook-outline
panel_title: Obsidian
map:
  - share:ro
options:
  vault_path: /share/obsidian-client/vault
  couchdb_url: ""
  couchdb_database: ""
  couchdb_username: ""
  couchdb_password: ""
  livesync_encryption_enabled: false
  livesync_e2ee_passphrase: ""
schema:
  vault_path: str
  couchdb_url: str?
  couchdb_database: str?
  couchdb_username: str?
  couchdb_password: password?
  livesync_encryption_enabled: bool
  livesync_e2ee_passphrase: password?
