name: "Obsidian MCP 0.2.7 (isolated test)"
version: "0.2.7-rc1"
slug: "obsidian_suite_test"
description: "One Home Assistant app for Obsidian notes, ChatGPT MCP access and LiveSync synchronization"
url: "https://github.com/sergey08/homeassistant-addons"
arch:
  - amd64
  - aarch64
startup: application
ingress: true
ingress_port: 8099
ingress_entry: /
boot: manual
init: false
map:
  - type: app_config
    read_only: false
  - type: share
    read_only: false
options:
  tunnel_id: ""
  enable_tunnel: false
  enable_livesync: false
  livesync_interval: 60
  vault_path: ""
  storage_mode: "Local - default"
  livesync_shared_vault_path: ""
schema:
  tunnel_id: str
  enable_tunnel: bool
  enable_livesync: bool
  livesync_interval: int(30,3600)
  vault_path: str
  storage_mode: list(livesync|local|Local - default)
  livesync_shared_vault_path: str
