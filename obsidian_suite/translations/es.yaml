configuration:
  tunnel_id:
    name: OpenAI tunnel ID
    description: "Identifier from OpenAI Platform > Organization settings > Tunnels (starts with tunnel_). This is not an API key."
  enable_tunnel:
    name: Enable ChatGPT tunnel
    description: "Start the locally provisioned OpenAI tunnel client so ChatGPT can access the private MCP server. Requires a tunnel ID, executable and runtime API key file."
  enable_livesync:
    name: Enable LiveSync
    description: "Synchronize the local Markdown vault with the configured CouchDB database using the existing LiveSync settings file. Do not run another writer for this vault."
  livesync_interval:
    name: LiveSync interval (seconds)
    description: "Time between LiveSync polling cycles, from 30 to 3600 seconds. Default is 60 seconds."

  vault_path:
    name: Carpeta Markdown local
    description: "En modo Local, indica una ruta dentro de /share. Si activas Crear carpeta local y dejas este campo vacío, se usa /share/obsidian-vault."
  create_local_vault:
    name: Crear carpeta local
    description: "Solo en modo Local. Al arrancar, crea la carpeta si falta y añade una nota de bienvenida. Si la carpeta ya existe, la usa tal como está."
  storage_mode:
    name: Modo de almacenamiento
    description: "LiveSync utiliza tu bóveda sincronizada con CouchDB. Local utiliza una carpeta Markdown en Home Assistant."
